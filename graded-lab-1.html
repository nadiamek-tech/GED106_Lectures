<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>GED 106 · Graded Lab 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{--wk:#0F766E;--wk-soft:rgba(15,118,110,.10);--wk-d:#5EEAD4;--wk-soft-d:rgba(94,234,212,.14)}
body{font-family:var(--f-display)}
.pt h1.pg{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:28px 0 6px}
.lock{max-width:440px;margin:26px 0;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:20px}
.lock b{display:block;font-size:1.1rem;margin-bottom:4px}
.lock p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.lock form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.lock input{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 1rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.lock .err{color:var(--bad);font-size:.9rem;margin:8px 0 0;min-height:1.2em}
.gl-meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.gl-meta span{font:700 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--wk);color:var(--wk);border-radius:999px;padding:2px 9px}
.gl-lead{font-size:1.05rem;max-width:62ch}
.gl-dl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--wk);border-radius:12px;padding:12px 14px;background:var(--surface);margin:14px 0 6px}
.gl-dl span{font-size:.92rem;color:var(--muted);flex:1 1 260px}
#gl h2{font-size:1.3rem;font-weight:800;margin:30px 0 10px}
.gl-steps{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:s}
.gl-steps li{counter-increment:s;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px 12px 58px;position:relative}
.gl-steps li::before{content:counter(s);position:absolute;left:16px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--wk);color:var(--on-wk,#fff);display:grid;place-items:center;font-weight:800}
.gl-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gl-h span{font:600 .78rem var(--f-mono);color:var(--muted);white-space:nowrap}
.gl-steps p{margin:6px 0 0;line-height:1.5}
.gl-tip{font-size:.88rem;color:var(--muted)}
.gl-tip code{font-family:var(--f-mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.scroll{overflow-x:auto}
.gl-rub{width:100%;border-collapse:collapse;font-size:.92rem}
.gl-rub th{font:400 .66rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.gl-rub td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.gl-rub td:first-child{font-weight:800;color:var(--wk)}
.gl-rub td:last-child{font-weight:700;text-align:right}
.gl-rub tr.tot td{font-weight:800}
</style>
</head>
<body>
<div id="hub"></div>
<main class="pt pt-wrap" id="portal">
<p style="margin:18px 0 0"><a class="pt-flag" href="labs.html">← Labs</a></p>
<h1 class="pg">Graded Lab 1 · Survey Design, Cleaning and Charts</h1>
<p class="sub">Week 9 · Eng. Nadia Mek</p>
<div class="lock" id="lock">
  <b>Enter the lab password</b>
  <p>Your professor gives it in the lab session.</p>
  <form id="unlock" autocomplete="off"><input id="pw" type="text" inputmode="text" aria-label="Lab password" placeholder="Password" spellcheck="false"><button class="btn" type="submit">Open</button></form>
  <p class="err" id="err" aria-live="polite"></p>
</div>
<div id="gl" hidden></div>
</main>
<footer class="pt-foot">This website is interactive course support. It does not replace classes, attendance or class activities.<br> <b>Eng. Nadia Mek</b></footer>
<script src="assets/supports.js?v=20261028c"></script>
<script src="assets/course.js?v=20261028c"></script>
<script src="assets/professor.js?v=20261028c"></script>
<script src="assets/course-info.js?v=20261028c"></script>
<script src="assets/portal.js?v=20261028c"></script>
<script src="assets/gl1-sealed.js?v=20261028c"></script>
<script>
Portal.header('labs');
(function(){
  const S=window.SEALED, enc=new TextEncoder(), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const KEY='g106-gl1-pass', err=document.getElementById('err'), inp=document.getElementById('pw');
  async function key(pw){ const base=await crypto.subtle.importKey('raw',enc.encode(pw.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(S.salt),iterations:S.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']); }
  const open=(k,x)=>crypto.subtle.decrypt({name:'AES-GCM',iv:b64(x.iv)},k,b64(x.ct));
  async function tryOpen(pw,quiet){
    if(!window.crypto||!crypto.subtle){ err.textContent='Please open this page in an up-to-date browser (Chrome, Edge or Safari).'; return; }
    try{ const k=await key(pw), html=new TextDecoder().decode(await open(k,S.page));
      const gl=document.getElementById('gl'); gl.innerHTML=html; gl.hidden=false; document.getElementById('lock').hidden=true;
      try{ sessionStorage.setItem(KEY,pw); }catch(e){}
      const g=document.getElementById('gl-get');
      g.addEventListener('click',async()=>{ const bytes=await open(k,S.file); const url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
        const a=document.createElement('a'); a.href=url; a.download=S.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); });
    }catch(e){ if(!quiet){ err.textContent='Wrong password. Try again.'; inp.select(); } }
  }
  document.getElementById('unlock').addEventListener('submit',e=>{ e.preventDefault(); err.textContent='Checking…'; tryOpen(inp.value).then(()=>{ if(err.textContent==='Checking…') err.textContent=''; }); });
  let saved=null; try{ saved=sessionStorage.getItem(KEY); }catch(e){}
  if(saved) tryOpen(saved,true);
})();
</script>
</body>
</html>
