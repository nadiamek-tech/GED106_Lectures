<style>
:root{--wk:#3D4FA0;--wk-soft:rgba(61,79,160,.10);--wk-d:#97A6F2;--wk-soft-d:rgba(151,166,242,.14)}
.scroll{overflow-x:auto}
.seg2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg2 button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.86rem}
.seg2 button[aria-pressed="true"]{border-color:var(--wk);background:var(--wk);color:var(--on-wk)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-family:var(--f-display);font-size:.8rem}
.kpis b{display:block;font-size:1.4rem}
.ans{font-family:var(--f-display);border-left:4px solid var(--wk);background:var(--wk-soft);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:8px}
.cols{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.72rem}
.cols td,.cols th{border:1px solid var(--line);padding:4px 6px;white-space:nowrap}
.cols th{background:var(--sunk)}

<script>
const {W,B}=Lecture;

/* ---------- Gartner-style ascendancy chart ---------- */
const LADDER=`<svg viewBox="0 0 560 300" role="img" aria-label="Four steps rising from left to right: descriptive, diagnostic, predictive, prescriptive. Each step is harder and more valuable.">
 <line x1="40" y1="270" x2="545" y2="270" stroke="var(--muted)"/><line x1="40" y1="270" x2="40" y2="20" stroke="var(--muted)"/>
 <text x="545" y="292" text-anchor="end" font-size="11" class="t-muted t-mono">DIFFICULTY →</text>
 <text x="14" y="145" font-size="11" class="t-muted t-mono" transform="rotate(-90 14 145)" text-anchor="middle">VALUE →</text>
 <rect x="52" y="210" width="112" height="60" rx="6" fill="var(--wk-soft)" stroke="var(--wk)"/>
 <rect x="174" y="160" width="112" height="110" rx="6" fill="var(--wk-soft)" stroke="var(--wk)"/>
 <rect x="296" y="105" width="112" height="165" rx="6" fill="var(--wk-soft)" stroke="var(--wk)"/>
 <rect x="418" y="45" width="118" height="225" rx="6" fill="var(--wk)"/>
 <text x="108" y="234" text-anchor="middle" font-size="12" font-weight="700">Descriptive</text><text x="108" y="252" text-anchor="middle" font-size="10" class="t-muted">What happened?</text>
 <text x="230" y="184" text-anchor="middle" font-size="12" font-weight="700">Diagnostic</text><text x="230" y="202" text-anchor="middle" font-size="10" class="t-muted">Why did it happen?</text>
 <text x="352" y="129" text-anchor="middle" font-size="12" font-weight="700">Predictive</text><text x="352" y="147" text-anchor="middle" font-size="10" class="t-muted">What will happen?</text>
 <text x="477" y="69" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--surface)">Prescriptive</text><text x="477" y="87" text-anchor="middle" font-size="10" style="fill:var(--surface)">What should we do?</text>
 <text x="108" y="200" text-anchor="middle" font-size="10" class="t-mono t-muted">hindsight</text><text x="230" y="150" text-anchor="middle" font-size="10" class="t-mono t-muted">insight</text><text x="352" y="95" text-anchor="middle" font-size="10" class="t-mono t-muted">foresight</text><text x="477" y="36" text-anchor="middle" font-size="10" class="t-mono t-muted">action</text></svg>`;

/* ---------- café analytics tool (fictional data) ---------- */
const TEMP=[34,36,38,35,40,41,39,37,42,43,36,38,44,41];
const SALES=[44,45,55,49,58,66,56,51,68,65,49,57,70,64];
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function fit(){ const mx=mean(TEMP), my=mean(SALES); let sxy=0,sxx=0,syy=0; TEMP.forEach((x,i)=>{sxy+=(x-mx)*(SALES[i]-my); sxx+=(x-mx)**2; syy+=(SALES[i]-my)**2;}); const b=sxy/sxx, a=my-b*mx, r=sxy/Math.sqrt(sxx*syy); const res=SALES.map((y,i)=>y-(a+b*TEMP[i])); const sd=Math.sqrt(res.reduce((s,e)=>s+e*e,0)/(res.length-2)); return {a,b,r,sd}; }
const FIT=fit();
function scatter(showLine,xMark){
  const X=t=>40+(t-32)/(46-32)*500, Y=s=>230-(s-35)/(75-35)*200;
  let s=`<svg viewBox="0 0 560 260" role="img" aria-label="Scatter plot of iced coffee sales against temperature, rising from left to right">
   <line x1="40" y1="230" x2="545" y2="230" stroke="var(--line)"/><line x1="40" y1="230" x2="40" y2="25" stroke="var(--line)"/>`;
  [34,38,42,46].forEach(t=>s+=`<text x="${X(t)}" y="248" text-anchor="middle" font-size="10" class="t-muted t-mono">${t}°C</text>`);
  [40,55,70].forEach(v=>s+=`<text x="34" y="${Y(v)+4}" text-anchor="end" font-size="10" class="t-muted t-mono">${v}</text><line x1="40" x2="545" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/>`);
  if(showLine) s+=`<line x1="${X(32)}" y1="${Y(FIT.a+FIT.b*32)}" x2="${X(46)}" y2="${Y(FIT.a+FIT.b*46)}" stroke="var(--wk)" stroke-width="2.5"/>`;
  TEMP.forEach((t,i)=>s+=`<circle cx="${X(t)}" cy="${Y(SALES[i])}" r="6" fill="var(--wk)" fill-opacity=".55" stroke="var(--wk)"/>`);
  if(xMark!=null){ const p=FIT.a+FIT.b*xMark; s+=`<line x1="${X(xMark)}" x2="${X(xMark)}" y1="230" y2="${Y(p)}" stroke="var(--warn)" stroke-dasharray="4 3"/><circle cx="${X(xMark)}" cy="${Y(p)}" r="8" fill="none" stroke="var(--warn)" stroke-width="3"/>`; }
  return s+`<text x="300" y="18" text-anchor="middle" font-size="11" class="t-muted t-mono">ICED COFFEES SOLD vs NOON TEMPERATURE · 14 DAYS</text></svg>`;
}
function cafe(el){
  const L=['Descriptive','Diagnostic','Predictive','Prescriptive'];
  el.innerHTML=`<div class="seg2">${L.map(l=>`<button type="button" data-l="${l}">${l}</button>`).join('')}</div><div class="out ui"></div><p class="mono" style="color:var(--muted);margin:8px 0 0">Fictional data for teaching. The maths is real: least-squares line and correlation computed in the page.</p>`;
  const out=el.querySelector('.out'), bs=el.querySelectorAll('.seg2 button');
  const show=l=>{ bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
    if(l==='Descriptive'){ const mx=Math.max(...SALES), mn=Math.min(...SALES);
      out.innerHTML=`<p style="margin:0"><b>What happened?</b> Summarise the last 14 days.</p><div class="kpis"><div>Average per day<b>${mean(SALES).toFixed(1)}</b></div><div>Best day<b>${mx}</b></div><div>Worst day<b>${mn}</b></div></div>
       <svg viewBox="0 0 560 120" role="img" aria-label="Daily sales bar chart">${SALES.map((v,i)=>`<rect x="${10+i*39}" y="${110-v*1.4}" width="30" height="${v*1.4}" rx="3" fill="var(--wk)" fill-opacity=".8"/><text x="${25+i*39}" y="${106-v*1.4}" text-anchor="middle" font-size="9" class="t-mono t-muted">${v}</text>`).join('')}</svg>
       <div class="ans">Answer: we sold about ${Math.round(mean(SALES))} iced coffees a day, between ${mn} and ${mx}.</div>`; }
    if(l==='Diagnostic'){ out.innerHTML=`<p style="margin:0"><b>Why did it happen?</b> Look for a factor that moves with sales.</p>${scatter(false)}<div class="ans">Hotter days sold more. Correlation r = ${FIT.r.toFixed(2)} (close to 1 means a strong positive link). But correlation is not proof of cause: check other factors too.</div>`; }
    if(l==='Predictive'){ out.innerHTML=`<p style="margin:0"><b>What will happen?</b> Use the pattern to forecast tomorrow.</p><label for="tt">Tomorrow's forecast temperature: <b id="tv"></b></label><input type="range" id="tt" min="33" max="46" value="40"><div id="sc"></div><div class="ans" id="pa"></div>`;
      const t=out.querySelector('#tt'); const upd=()=>{ const x=+t.value, p=FIT.a+FIT.b*x; out.querySelector('#tv').textContent=x+'°C'; out.querySelector('#sc').innerHTML=scatter(true,x);
        out.querySelector('#pa').innerHTML=`Predicted sales ≈ <b>${Math.round(p)}</b>, likely between ${Math.round(p-2*FIT.sd)} and ${Math.round(p+2*FIT.sd)}. ${x>44||x<34?'<br><b>Careful:</b> this is outside the temperatures we have data for, so the prediction is less trustworthy.':''}`; };
      t.addEventListener('input',upd); upd(); }
    if(l==='Prescriptive'){ out.innerHTML=`<p style="margin:0"><b>What should we do?</b> Turn the forecast into a decision: how many cups and ice to prepare?</p><label for="pt">Forecast: <b id="pv"></b></label><input type="range" id="pt" min="33" max="46" value="42"><div class="seg2" id="pr" style="margin-top:8px"><button type="button" data-k="run" aria-pressed="true">Running out is worse</button><button type="button" data-k="waste" aria-pressed="false">Waste is worse</button></div><div class="ans" id="ra"></div>`;
      let k='run'; const t=out.querySelector('#pt');
      const upd=()=>{ const x=+t.value, p=FIT.a+FIT.b*x, rec=Math.round(k==='run'?p+FIT.sd:p-FIT.sd*0.5); out.querySelector('#pv').textContent=x+'°C';
        out.querySelector('#ra').innerHTML=`Recommendation: prepare <b>${rec}</b> iced coffees (forecast ${Math.round(p)}${k==='run'?' plus a safety margin':' minus a little, to avoid waste'}). A person still checks: is there an event on campus tomorrow?`; };
      t.addEventListener('input',upd); out.querySelectorAll('#pr button').forEach(b=>b.addEventListener('click',()=>{ k=b.dataset.k; out.querySelectorAll('#pr button').forEach(x=>x.setAttribute('aria-pressed',x===b)); upd(); })); upd(); }
  };
  bs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.l))); show('Descriptive');
}

/* ---------- Forms export columns ---------- */
const EXPORT=`<div class="scroll"><table class="cols"><tr><th>ID</th><th class="drop">Start time</th><th>Completion time</th><th class="drop">Email</th><th class="drop">Name</th><th>Q1 Major</th><th>Q2 Hours studied</th><th>Q3 Rating</th></tr>
<tr><td>1</td><td class="drop">10/14 17:02</td><td>10/14 17:05</td><td class="drop">anonymous</td><td class="drop"></td><td>Business</td><td>6</td><td>4</td></tr>
<tr><td>2</td><td class="drop">10/14 17:03</td><td>10/14 17:04</td><td class="drop">anonymous</td><td class="drop"></td><td>Design</td><td>10</td><td>5</td></tr></table></div><p class="mono" style="color:var(--muted)">Example layout. Columns crossed out are usually not needed for analysis, and removing names and emails protects privacy.</p>`;

Lecture.mount({
  id:'g106-lab4', course:'GED 106', week:4, clo:'3, 4', short:'Lab 4 · Data Collection and Exporting',
  title:'Lab 4 · Data Collection and Exporting',
  meta:'Lab · Week 4',
  scenes:[
  { nav:'The lab · Export', title:'Lab 4 · Data Collection and Exporting', kind:'activity', minutes:35, wide:true,
    narration:[
     `Lab task from the syllabus: <strong>Simulate and record responses. Download and format structured data for Excel-based analysis.</strong> (CLO3, CLO4)`,
     `<ul><li><b>Simulate:</b> each group member submits 4–5 responses to your Week 3 survey, playing different kinds of students. Include one “messy” response on purpose (for example, a typo or a skipped question). You need at least 15 responses.</li><li><b>Export:</b> in Forms, open <b>Responses</b> → <b>Open results in Excel</b>.</li><li><b>Format:</b> delete columns you do not need, rename headers to short names, select the data and use <b>Format as Table</b>, then <b>View → Freeze Top Row</b>.</li><li><b>Save</b> as Lab04_GroupName in your OneDrive Labs folder.</li></ul>`,
     B.plain(`<b>Privacy first:</b> if your form recorded names or emails, remove those columns before you analyse or share the file.`),
     B.exam(`Be able to explain why simulated test data is useful (to test the survey and the analysis before real data arrives) and why it must never be reported as real results.`)],
    src:`Lab reading: Microsoft official tutorials, Data Literacy in Practice Ch. 4.`,
    notes:[`Check that each group has a real Excel Table (banded rows, filter arrows in the header).`,`Simulated responses are for practice only. Groups collect real responses later for the project.`],
    fig:{label:`A typical Forms export · then the steps`, html:EXPORT, flow:[
      {t:'Simulate',s:'15+ responses',d:'Everyone answers as different “students”. Add one messy answer on purpose.'},
      {t:'Open in Excel',s:'Responses tab',d:'Forms → Responses → Open results in Excel.'},
      {t:'Trim columns',s:'privacy',d:'Remove names, emails and start times you do not need.'},
      {t:'Format as Table',s:'Home tab',d:'Short headers, Format as Table, Freeze Top Row.'},
      {t:'Save',s:'OneDrive',d:'Lab04_GroupName in your Labs folder.'}]} },

  { nav:'Submit', title:'Before you leave', kind:'check',
    narration:[`<b>Submit on Moodle:</b><ul><li>Lab04_GroupName.xlsx: 15+ responses, formatted as a Table, no names or emails</li></ul>`,`Save everything in <b>OneDrive › GED106 › Labs</b>.`,`Lecture: <a href="week-04.html">Week 4</a> · All labs: <a href="index.html#labs">Labs</a>`],
    src:`Lab reading: Microsoft official tutorials, Data Literacy in Practice Ch. 4.` }
  ]
});
</script>
