<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Lab · Choose, Design and Build Your Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{--wk:#0E7490;--wk-soft:rgba(14,116,144,.09);--wk-d:#67E8F9;--wk-soft-d:rgba(103,232,249,.14)}
.pj{font-family:var(--f-display)}
.sec-tabs{display:flex;gap:8px;margin:0 0 12px}
.sec-tabs button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 18px;font:800 .95rem var(--f-display);cursor:pointer}
.sec-tabs button[aria-pressed="true"]{background:var(--wk);border-color:var(--wk);color:var(--on-wk,#fff)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.pcard{text-align:left;border:1.5px solid var(--line);border-top:5px solid var(--wk);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px;cursor:pointer;font-family:var(--f-display)}
.pcard small{display:block;font:700 .66rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pcard b{display:block;font-size:1rem;margin:3px 0}
.pcard span{font-size:.84rem;color:var(--muted)}
.pcard[aria-pressed="true"]{border-color:var(--wk);background:var(--wk-soft);outline:2px solid var(--wk)}
.pdet{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px}
.pdet h3{margin:0 0 4px;font:800 1.2rem var(--f-display)}
.pdet .row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;margin:10px 0;font-size:.93rem}
.pdet .row b{color:var(--wk)}
.pdet ol{margin:4px 0;padding-left:1.2em;line-height:1.55}
.pdet code{font:600 .8rem var(--f-mono);background:var(--wk-soft);border-radius:4px;padding:1px 5px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.btns a,.btns button{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:700 .92rem var(--f-display);padding:9px 14px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:var(--bg);cursor:pointer}
.btns .p{background:var(--wk);border-color:var(--wk);color:var(--on-wk,#fff)}
.btns .x{background:#107C41;border-color:#107C41;color:#fff}
.hint{font-size:.88rem;color:var(--muted);margin:6px 0 0}
/* design tool */
.dz{font-family:var(--f-display)}
.dz-form{display:grid;gap:8px}
.dz-form label{display:grid;gap:3px;font-size:.86rem;font-weight:700}
.dz-form input,.dz-form select{font:500 .95rem var(--f-display);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.dz-q{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:end}
.dz-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dz-prev{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px}
.dz-prev svg{width:100%;height:auto;display:block}
@media (max-width:560px){.dz-q{grid-template-columns:minmax(0,1fr)}.dz-k{grid-template-columns:minmax(0,1fr)}.pdet .row{grid-template-columns:minmax(0,1fr)}}
/* steps and survey */
.st{display:grid;gap:10px;font-family:var(--f-display)}
.st>div{border:1px solid var(--line);border-left:5px solid var(--wk);border-radius:12px;background:var(--surface);padding:10px 14px}
.st b.h{display:block;font-size:1rem;margin-bottom:2px}
.st ol{margin:4px 0;padding-left:1.2em;line-height:1.6}
.k{font:700 .8rem var(--f-mono);background:var(--wk-soft);border:1px solid var(--wk);border-radius:6px;padding:1px 6px}
.note{border:1px dashed var(--wk);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.9rem;background:var(--wk-soft)}
.svq{counter-reset:q;display:grid;gap:6px;font-family:var(--f-display)}
.svq div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:.93rem}
.svq div::before{counter-increment:q;content:counter(q)". ";font-weight:800;color:var(--wk)}
.svq small{color:var(--muted)}
.cnt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-weight:700}
.cnt .dots{display:flex;gap:4px}
.cnt .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--wk);display:inline-block}
.cnt .dots i.on{background:var(--wk)}
.cnt button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;font:800 1rem var(--f-display);cursor:pointer}
</style>

const VIZ=['Card','Bar (sorted)','Column','Line','Donut','Table / Matrix','Scatter'];
let pick=null; try{ pick=localStorage.getItem('g106-proj'); }catch(e){}
const getP=id=>P.find(x=>x.id===id);

function chooser(el){
  let sec=(pick&&getP(pick)?getP(pick).sec:'201');
  el.innerHTML=`<div class="pj"><div class="sec-tabs" role="group" aria-label="Your section"><button type="button" data-s="201">Section 201</button><button type="button" data-s="202">Section 202</button></div><div class="pgrid"></div><div class="pdet" hidden></div></div>`;
  const grid=el.querySelector('.pgrid'), det=el.querySelector('.pdet');
  const show=id=>{ const p=getP(id); if(!p){ det.hidden=true; return; }
    det.hidden=false; det.innerHTML=`<small style="font:700 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)">Section ${p.sec} · ${p.th}</small><h3>${p.t}</h3>
    <div class="row"><b>Open data</b><span>${p.src}</span><b>One row is</b><span>${p.row}</span><b>Key columns</b><span><code>${p.cols}</code></span></div>
    <b style="color:var(--wk)">Questions to guide your study</b><ol>${p.qs.map((q,i)=>`<li>${q} <span class="hint">→ ${p.viz[i]}</span></li>`).join('')}</ol>
    <p class="note"><b>Power BI tip:</b> ${p.tip}</p>
    <div class="btns"><a class="x" href="${p.url}" target="_blank" rel="noopener">Open the data ↗</a><button type="button" class="p pick">${pick===p.id?'✓ Our project':'Choose this project'}</button></div>
    <p class="hint">Kaggle: sign in with any free account, then Download. Write a fourth question of your own.</p>`;
    det.querySelector('.pick').onclick=()=>{ pick=p.id; try{ localStorage.setItem('g106-proj',p.id); }catch(e){} paint(); show(p.id); document.dispatchEvent(new CustomEvent('g106proj')); }; };
  const paint=()=>{ el.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===sec));
    grid.innerHTML=P.filter(p=>p.sec===sec).map((p,i)=>`<button type="button" class="pcard" data-id="${p.id}" aria-pressed="${pick===p.id}"><small>${i+1} · ${p.th}</small><b>${p.t}</b><span>${p.src.split(' · ')[0]}</span></button>`).join('');
    grid.querySelectorAll('.pcard').forEach(c=>c.onclick=()=>{ grid.querySelectorAll('.pcard').forEach(x=>x.setAttribute('aria-pressed',x===c||x.dataset.id===pick)); show(c.dataset.id); det.scrollIntoView({behavior:'smooth',block:'nearest'}); }); };
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ sec=b.dataset.s; det.hidden=true; paint(); });
  paint(); if(pick&&getP(pick)&&getP(pick).sec===sec) show(pick);
}

/* ---------- dashboard sketch tool ---------- */
const MINI={'Card':(x,y,w,h)=>`<rect x="${x+w*.15}" y="${y+h*.3}" width="${w*.7}" height="${h*.4}" rx="6" fill="var(--wk-soft)" stroke="var(--wk)"/><text x="${x+w/2}" y="${y+h/2+6}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--wk)">123</text>`,
 'Bar (sorted)':(x,y,w,h)=>[.9,.7,.55,.4,.25].map((v,i)=>`<rect x="${x+12}" y="${y+12+i*(h-24)/5}" width="${(w-24)*v}" height="${(h-24)/5*.65}" fill="var(--wk)" fill-opacity="${i?0.5:1}"/>`).join(''),
 'Column':(x,y,w,h)=>[.5,.8,.6,.95,.4,.7].map((v,i)=>`<rect x="${x+12+i*(w-24)/6}" y="${y+h-12-(h-24)*v}" width="${(w-24)/6*.65}" height="${(h-24)*v}" fill="var(--wk)" fill-opacity=".75"/>`).join(''),
 'Line':(x,y,w,h)=>`<polyline points="${[.3,.45,.4,.65,.6,.85].map((v,i)=>`${x+14+i*(w-28)/5},${y+h-14-(h-28)*v}`).join(' ')}" fill="none" stroke="var(--wk)" stroke-width="3"/>`,
 'Donut':(x,y,w,h)=>{ const r=Math.min(w,h)/2-14; return `<circle cx="${x+w/2}" cy="${y+h/2}" r="${r}" fill="none" stroke="var(--wk)" stroke-width="${r*.5}" stroke-dasharray="${2*Math.PI*r*.55} ${2*Math.PI*r}"/><circle cx="${x+w/2}" cy="${y+h/2}" r="${r}" fill="none" stroke="var(--muted)" stroke-opacity=".4" stroke-width="${r*.5}" stroke-dasharray="0 ${2*Math.PI*r*.55} ${2*Math.PI*r*.45}"/>`; },
 'Table / Matrix':(x,y,w,h)=>[0,1,2,3,4].map(i=>`<rect x="${x+12}" y="${y+12+i*(h-24)/5}" width="${w-24}" height="${(h-24)/5}" fill="${i?'none':'var(--wk-soft)'}" stroke="var(--line)"/>`).join('')+`<line x1="${x+w/2}" y1="${y+12}" x2="${x+w/2}" y2="${y+h-12}" stroke="var(--line)"/>`,
 'Scatter':(x,y,w,h)=>[[.1,.2],[.2,.3],[.3,.35],[.4,.5],[.5,.45],[.6,.6],[.7,.7],[.8,.75],[.9,.85],[.35,.25],[.65,.55]].map(([a,b])=>`<circle cx="${x+12+(w-24)*a}" cy="${y+h-12-(h-24)*b}" r="4" fill="var(--wk)"/>`).join('')};
const toViz=v=>{ const M=[[/scatter/i,'Scatter'],[/donut|pie/i,'Donut'],[/line/i,'Line'],[/column|histogram/i,'Column'],[/bar/i,'Bar (sorted)'],[/matrix|table/i,'Table / Matrix'],[/card/i,'Card']]; let best=null,bi=1e9; M.forEach(([r,n])=>{ const i=v.search(r); if(i>=0&&i<bi){bi=i;best=n;} }); return best||'Column'; };
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function wrap(s,n){ const w=String(s||'').split(' '), L=['']; w.forEach(x=>{ if((L[L.length-1]+' '+x).trim().length>n) L.push(x); else L[L.length-1]=(L[L.length-1]+' '+x).trim(); }); return L.slice(0,2); }
function sketch(d){ const Wd=760,H=520, ff='font-family="Schibsted Grotesk,Arial,sans-serif"';
  const box=(x,y,w,h,q,v,big)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--surface)" stroke="var(--line)"/>`+wrap(q,big?60:38).map((l,i)=>`<text x="${x+10}" y="${y+20+i*15}" font-size="12" font-weight="700" fill="var(--ink)" ${ff}>${esc(l)}</text>`).join('')+`<text x="${x+w-10}" y="${y+h-8}" text-anchor="end" font-size="10" fill="var(--muted)" ${ff}>${esc(v)}</text>`+(MINI[v]?MINI[v](x,y+40,w,h-56):'');
  let s=`<svg viewBox="0 0 ${Wd} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dashboard sketch" ${ff}><rect x="1" y="1" width="${Wd-2}" height="${H-2}" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>`;
  s+=`<text x="18" y="36" font-size="20" font-weight="800" fill="var(--ink)">${esc(d.title||'Your title = your main message')}</text><text x="18" y="56" font-size="11" fill="var(--muted)">${esc(d.sub||'')}</text>`;
  s+=`<rect x="560" y="16" width="184" height="34" rx="8" fill="var(--wk-soft)" stroke="var(--wk)"/><text x="652" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">Slicer: ${esc(d.slicer||'…')}</text>`;
  d.kpi.forEach((k,i)=>{ const x=18+i*244; s+=`<rect x="${x}" y="70" width="232" height="64" rx="10" fill="var(--wk-soft)"/><text x="${x+116}" y="100" text-anchor="middle" font-size="20" font-weight="800" fill="var(--wk)">123</text><text x="${x+116}" y="122" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(k||'KPI '+(i+1))}</text>`; });
  s+=box(18,148,440,180,d.q[0],d.v[0],true)+box(470,148,272,180,d.q[1],d.v[1])+box(18,340,440,166,d.q[2],d.v[2],true)+box(470,340,272,166,d.q[3],d.v[3]);
  return s+'</svg>'; }
function designer(el){
  const KEY='g106-sketch'; let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  const fresh=()=>{ const p=getP(pick); return {pid:pick,title:'',sub:p?p.t+' · '+p.src:'',slicer:'',kpi:['','',''],q:p?[...p.qs,'Your own question']:['','','',''],v:p?[...p.viz.map(toViz),'Card']:['Line','Bar (sorted)','Column','Donut']}; };
  if(!d||d.pid!==pick) d=fresh();
  const draw=()=>{ el.innerHTML=`<div class="dz">${pick?`<p class="hint">Project: <b>${getP(pick).t}</b>. Questions are filled from your project; change them.</p>`:'<p class="hint">Choose a project above first, or sketch freely.</p>'}
    <div class="dz-form"><label>Title (your main message)<input data-f="title" value="${esc(d.title)}" placeholder="e.g. Shawarma wins, and dinner is the rush hour"></label>
    <div class="dz-k">${d.kpi.map((k,i)=>`<label>KPI card ${i+1}<input data-k="${i}" value="${esc(k)}" placeholder="${['Total sales','Number of …','Average …'][i]}"></label>`).join('')}</div>
    ${d.q.map((q,i)=>`<div class="dz-q"><label>Question ${i+1}${i===0?' · main chart':''}<input data-q="${i}" value="${esc(q)}"></label><label>Visual<select data-v="${i}">${VIZ.map(v=>`<option ${v===d.v[i]?'selected':''}>${v}</option>`).join('')}</select></label></div>`).join('')}
    <label>Slicer (filter)<input data-f="slicer" value="${esc(d.slicer)}" placeholder="e.g. Year, City, Category"></label></div>
    <div class="dz-prev"></div><div class="btns"><button type="button" class="p dl">⬇ Download sketch (PNG)</button><button type="button" class="rs">Start again</button></div>
    <p class="hint">Put the PNG in your report draft, then build it in Power BI.</p></div>`;
    const prev=el.querySelector('.dz-prev'), save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} prev.innerHTML=sketch(d); };
    el.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{ d[i.dataset.f]=i.value; save(); });
    el.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{ d.kpi[+i.dataset.k]=i.value; save(); });
    el.querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{ d.q[+i.dataset.q]=i.value; save(); });
    el.querySelectorAll('[data-v]').forEach(i=>i.onchange=()=>{ d.v[+i.dataset.v]=i.value; save(); });
    el.querySelector('.rs').onclick=()=>{ d=fresh(); try{ localStorage.removeItem(KEY); }catch(e){} draw(); };
    el.querySelector('.dl').onclick=()=>{ const cs=getComputedStyle(document.documentElement), vars=['--bg','--surface','--line','--ink','--muted','--wk','--wk-soft'];
      let src=sketch(d); vars.forEach(v=>{ src=src.split(`var(${v})`).join(cs.getPropertyValue(v).trim()||'#888'); });
      const img=new Image(), url=URL.createObjectURL(new Blob([src],{type:'image/svg+xml'}));
      img.onload=()=>{ const c=document.createElement('canvas'); c.width=1520; c.height=1040; const x=c.getContext('2d'); x.fillStyle=cs.getPropertyValue('--bg').trim()||'#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='dashboard-sketch.png'; a.click(); }); URL.revokeObjectURL(url); };
      img.src=url; };
    save(); };
  draw(); document.addEventListener('g106proj',()=>{ d=fresh(); draw(); });
}

/* ---------- peer feedback ---------- */
const SURVEY=[
 ['The title tells me the main message.','Rating 1–5'],
 ['I can find the key numbers in 5 seconds.','Rating 1–5'],
 ['Each chart type fits its question.','Rating 1–5'],
 ['The layout is easy to follow (most important first).','Rating 1–5'],
 ['Labels, units and colours are clear.','Rating 1–5'],
 ['The recommendation is convincing.','Rating 1–5'],
 ['What is the strongest part of this dashboard?','Text'],
 ['Name one thing the team should change.','Text'],
 ['Your section','Choice: 201 · 202']];
function survey(el){
  const txt='Peer review · GED 106 project dashboard\n\n'+SURVEY.map(([q,t],i)=>`${i+1}. ${q} (${t})`).join('\n');
  let n=0; try{ n=+localStorage.getItem('g106-reviews')||0; }catch(e){}
  el.innerHTML=`<div class="svq">${SURVEY.map(([q,t])=>`<div>${q} <small>· ${t}</small></div>`).join('')}</div>
   <div class="btns"><button type="button" class="p cp">Copy the questions</button><a class="x" href="https://forms.office.com" target="_blank" rel="noopener">Open Microsoft Forms ↗</a></div>
   <div class="cnt">Reviews received <span class="dots"></span><span class="n"></span><button type="button" class="m" aria-label="One less">−</button><button type="button" class="pl" aria-label="One more">+</button></div>`;
  const paint=()=>{ el.querySelector('.dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join(''); el.querySelector('.n').textContent=n>=10?`${n} · done ✓`:`${n} of 10`; try{ localStorage.setItem('g106-reviews',n); }catch(e){} };
  el.querySelector('.pl').onclick=()=>{ n++; paint(); }; el.querySelector('.m').onclick=()=>{ n=Math.max(0,n-1); paint(); };
  el.querySelector('.cp').onclick=e=>{ try{ navigator.clipboard.writeText(txt); e.target.textContent='Copied ✓'; }catch(x){} };
  paint(); }
