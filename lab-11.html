<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Lab · Choose, Design and Build Your Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css?v=20261111">
<style>
:root{--wk:#0E7490;--wk-soft:rgba(14,116,144,.09);--wk-d:#67E8F9;--wk-soft-d:rgba(103,232,249,.14)}
.pj{font-family:var(--f-display)}
.sec-tabs{display:flex;gap:8px;margin:0 0 12px}
.sec-tabs button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 18px;font:800 .95rem var(--f-display);cursor:pointer}
.sec-tabs button[aria-pressed="true"]{background:var(--wk);border-color:var(--wk);color:var(--on-wk,#fff)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.pcard{text-align:left;border:1.5px solid var(--line);border-top:5px solid var(--wk);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px;cursor:pointer;font-family:var(--f-display)}
.pcard small{display:block;font:700 .66rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pcard b{display:block;font-size:1rem;margin:3px 0}
.pcard span{font-size:.84rem;color:var(--muted)}
.pcard[aria-pressed="true"]{border-color:var(--wk);background:var(--wk-soft);outline:2px solid var(--wk)}
.pdet{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px}
.pdet h3{margin:0 0 4px;font:800 1.2rem var(--f-display)}
.pdet .row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;margin:10px 0;font-size:.93rem}
.pdet .row b{color:var(--wk)}
.pdet ol{margin:4px 0;padding-left:1.2em;line-height:1.55}
.pdet code{font:600 .8rem var(--f-mono);background:var(--wk-soft);border-radius:4px;padding:1px 5px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.btns a,.btns button{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:700 .92rem var(--f-display);padding:9px 14px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:var(--bg);cursor:pointer}
.btns .p{background:var(--wk);border-color:var(--wk);color:var(--on-wk,#fff)}
.btns .x{background:#107C41;border-color:#107C41;color:#fff}
.hint{font-size:.88rem;color:var(--muted);margin:6px 0 0}
/* teams table */
.tt{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tt-t{width:100%;border-collapse:collapse;font-family:var(--f-display);font-size:.93rem}
.tt-t th{background:var(--wk-soft);text-align:left;padding:8px 10px;font:800 .8rem var(--f-display);border-bottom:1px solid var(--line)}
.tt-t td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tt-t td small{color:var(--muted)}
.tt-t input[type=text],.tt-t input:not([type]){width:100%;box-sizing:border-box;font:600 .93rem var(--f-display);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tt-t input[type=checkbox]{width:20px;height:20px;accent-color:var(--wk)}
.tt-t tr.taken td:first-child{box-shadow:inset 4px 0 0 var(--wk)}
.tt-t tr.taken{background:var(--wk-soft)}
.pcard .tm{display:inline-block;margin-top:6px;font:800 .72rem var(--f-display);background:var(--wk);color:var(--on-wk,#fff);border-radius:999px;padding:2px 9px}
/* design tool */
.dz{font-family:var(--f-display)}
.dz-form{display:grid;gap:8px}
.dz-form label{display:grid;gap:3px;font-size:.86rem;font-weight:700}
.dz-form input,.dz-form select{font:500 .95rem var(--f-display);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.dz-q{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:end}
.dz-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dz-prev{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px}
.dz-prev svg{width:100%;height:auto;display:block}
@media (max-width:560px){.dz-q{grid-template-columns:minmax(0,1fr)}.dz-k{grid-template-columns:minmax(0,1fr)}.pdet .row{grid-template-columns:minmax(0,1fr)}}
/* steps and survey */
.st{display:grid;gap:10px;font-family:var(--f-display)}
.st>div{border:1px solid var(--line);border-left:5px solid var(--wk);border-radius:12px;background:var(--surface);padding:10px 14px}
.st b.h{display:block;font-size:1rem;margin-bottom:2px}
.st ol{margin:4px 0;padding-left:1.2em;line-height:1.6}
.k{font:700 .8rem var(--f-mono);background:var(--wk-soft);border:1px solid var(--wk);border-radius:6px;padding:1px 6px}
.note{border:1px dashed var(--wk);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.9rem;background:var(--wk-soft)}
.svq{counter-reset:q;display:grid;gap:6px;font-family:var(--f-display)}
.svq div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:.93rem}
.svq div::before{counter-increment:q;content:counter(q)". ";font-weight:800;color:var(--wk)}
.svq small{color:var(--muted)}
.cnt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-weight:700}
.cnt .dots{display:flex;gap:4px}
.cnt .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--wk);display:inline-block}
.cnt .dots i.on{background:var(--wk)}
.cnt button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;font:800 1rem var(--f-display);cursor:pointer}
</style>
</head>
<body>
<script src="assets/supports.js?v=20261111"></script>
<script src="assets/course.js?v=20261111"></script>
<script src="assets/kb.js?v=20261111"></script>
<script src="assets/search-index.js?v=20261111"></script>
<script src="assets/assistant.js?v=20261111"></script>
<script src="assets/onepage.js?v=20261111b"></script>
<script src="assets/projects.js?v=20261111e"></script>
<script>
const {W}=Lecture;
let pick=null; try{ pick=localStorage.getItem('g106-proj'); }catch(e){}

const tname=id=>{ let T={}; try{ T=JSON.parse(localStorage.getItem('g106-teams')||'{}')||{}; }catch(e){} return (T[id]&&T[id].team)||TEAMS[id]||''; };
function chooser(el){
  let sec=(pick&&getP(pick)?getP(pick).sec:'201');
  el.innerHTML=`<div class="pj"><div class="sec-tabs" role="group" aria-label="Your section"><button type="button" data-s="201">Section 201</button><button type="button" data-s="202">Section 202</button></div><div class="pgrid"></div><div class="pdet" hidden></div></div>`;
  const grid=el.querySelector('.pgrid'), det=el.querySelector('.pdet');
  const show=id=>{ const p=getP(id); if(!p){ det.hidden=true; return; }
    det.hidden=false; det.innerHTML=`<small style="font:700 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)">Section ${p.sec} · ${p.th}</small><h3>${p.t}</h3>
    <div class="row"><b>Open data</b><span>${p.src}</span><b>One row is</b><span>${p.row}</span><b>Key columns</b><span><code>${p.cols}</code></span></div>
    <b style="color:var(--wk)">Questions to guide your study</b><ol>${p.qs.map((q,i)=>`<li>${q} <span class="hint">→ ${p.viz[i]}</span></li>`).join('')}</ol>
    <p class="note"><b>Power BI tip:</b> ${p.tip}</p>
    <div class="btns"><a class="x" href="${p.url}" target="_blank" rel="noopener">Open the data ↗</a>${p.alt?`<a href="${p.alt[1]}" target="_blank" rel="noopener">${p.alt[0]} ↗</a>`:''}<a href="https://www.google.com/search?q=${encodeURIComponent(p.src.split(' · ').slice(1).join(' ')+' dataset download')}" target="_blank" rel="noopener">Backup: search it ↗</a><button type="button" class="p pick">${pick===p.id?'✓ Our project':'Choose this project'}</button></div>
    <p class="hint">${p.url.includes('kaggle')?'Kaggle: sign in free with Google or your CUD email, then click <b>Download</b>. If Kaggle is blocked on campus Wi-Fi, use your phone’s data or the backup link.':p.url.includes('mavenanalytics')?'Maven Analytics: click <b>Download</b> (free, no sign-in needed).':p.url.includes('huggingface')?'Hugging Face: open <b>Files and versions</b> → download the CSV.':'Free, no sign-in needed: look for <b>Download</b> or <b>CSV</b>.'} Write a fourth question of your own.</p>`;
    det.querySelector('.pick').onclick=()=>{ pick=p.id; try{ localStorage.setItem('g106-proj',p.id); }catch(e){} paint(); show(p.id); document.dispatchEvent(new CustomEvent('g106proj')); }; };
  const paint=()=>{ el.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===sec));
    grid.innerHTML=P.filter(p=>p.sec===sec).map((p,i)=>`<button type="button" class="pcard" data-id="${p.id}" aria-pressed="${pick===p.id}"><small>${i+1} · ${p.th}</small><b>${p.t}</b><span>${p.src.split(' · ')[0]}</span>${tname(p.id)?`<span class="tm">${esc(tname(p.id))}</span>`:''}</button>`).join('');
    grid.querySelectorAll('.pcard').forEach(c=>c.onclick=()=>{ grid.querySelectorAll('.pcard').forEach(x=>x.setAttribute('aria-pressed',x===c||x.dataset.id===pick)); show(c.dataset.id); det.scrollIntoView({behavior:'smooth',block:'nearest'}); }); };
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ sec=b.dataset.s; det.hidden=true; paint(); });
  paint(); if(pick&&getP(pick)&&getP(pick).sec===sec) show(pick);
  document.addEventListener('g106teams',paint);
}


/* ---------- teams and projects table ---------- */
function teamsTable(el){
  const KEYT='g106-teams'; let T={}; try{ T=JSON.parse(localStorage.getItem(KEYT)||'{}')||{}; }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEYT,JSON.stringify(T)); }catch(e){} document.dispatchEvent(new CustomEvent('g106teams')); };
  let sec=(pick&&getP(pick)?getP(pick).sec:'201');
  const val=(id,f)=>(T[id]&&T[id][f])||(f==='team'&&TEAMS[id])||'';
  const draw=()=>{ el.innerHTML=`<div class="pj"><div class="sec-tabs" role="group" aria-label="Section"><button type="button" data-s="201">Section 201</button><button type="button" data-s="202">Section 202</button></div>
    <div class="tt"><table class="tt-t"><thead><tr><th style="width:4%">#</th><th style="width:30%">Project</th><th style="width:22%">Team name</th><th>Members</th><th style="width:12%">Data opened</th></tr></thead><tbody>
    ${P.filter(p=>p.sec===sec).map((p,i)=>`<tr data-id="${p.id}" class="${val(p.id,'team')?'taken':''}"><td>${i+1}</td><td><b>${p.t}</b><br><small>${p.src}</small></td><td><input data-f="team" value="${esc(val(p.id,'team'))}" placeholder="Team name" aria-label="Team name for ${p.t}"></td><td><input data-f="mem" value="${esc(val(p.id,'mem'))}" placeholder="Names" aria-label="Members for ${p.t}"></td><td style="text-align:center"><input type="checkbox" data-f="ok" ${val(p.id,'ok')?'checked':''} aria-label="Data opened for ${p.t}"></td></tr>`).join('')}
    </tbody></table></div>
    <div class="btns"><button type="button" class="p xl">⬇ Download (Excel)</button><button type="button" class="pr">Print</button><span class="hint tt-n"></span></div></div>`;
    el.querySelectorAll('[data-s]').forEach(b=>{ b.setAttribute('aria-pressed',b.dataset.s===sec); b.onclick=()=>{ sec=b.dataset.s; draw(); }; });
    el.querySelectorAll('tbody tr').forEach(tr=>tr.querySelectorAll('[data-f]').forEach(i=>{ const ev=i.type==='checkbox'?'change':'input';
      i.addEventListener(ev,()=>{ const id=tr.dataset.id; T[id]=T[id]||{}; T[id][i.dataset.f]=i.type==='checkbox'?i.checked:i.value; tr.classList.toggle('taken',!!val(id,'team')); save(); count(); }); }));
    el.querySelector('.xl').onclick=()=>{ const rows=[['Section','#','Project','Data source','Team name','Members','Data opened']];
      ['201','202'].forEach(s=>P.filter(p=>p.sec===s).forEach((p,i)=>rows.push([s,i+1,p.t,p.src,val(p.id,'team'),val(p.id,'mem'),val(p.id,'ok')?'Yes':''])));
      const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='GED106_Project_Teams.csv'; a.click(); };
    el.querySelector('.pr').onclick=()=>{ const w=window.open('','_blank'); if(!w) return; w.document.write(`<title>GED 106 · Project teams</title><style>body{font:12px Arial;margin:20px}h2{color:#0E7490}table{border-collapse:collapse;width:100%;margin-bottom:18px}td,th{border:1px solid #999;padding:6px;text-align:left}th{background:#E3F1F5}</style>`+['201','202'].map(s=>`<h2>GED 106 · Section ${s} · Project teams</h2><table><tr><th>#</th><th>Project</th><th>Team</th><th>Members</th></tr>${P.filter(p=>p.sec===s).map((p,i)=>`<tr><td>${i+1}</td><td>${p.t}</td><td>${esc(val(p.id,'team'))}</td><td>${esc(val(p.id,'mem'))}</td></tr>`).join('')}</table>`).join('')); w.document.close(); w.print(); };
    count(); };
  const count=()=>{ const n=P.filter(p=>p.sec===sec&&val(p.id,'team')).length; el.querySelector('.tt-n').textContent=`${n} of 10 projects taken in Section ${sec} · saved in this browser`; };
  draw(); }
function designer(el){
  const KEY='g106-sketch'; let d=null; try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  const fresh=()=>{ const p=getP(pick); return {pid:pick,title:'',sub:p?p.t+' · '+p.src:'',slicer:'',kpi:['','',''],q:p?[...p.qs,'Your own question']:['','','',''],v:p?[...p.viz.map(toViz),'Card']:['Line','Bar (sorted)','Column','Donut']}; };
  if(!d||d.pid!==pick) d=fresh();
  const draw=()=>{ el.innerHTML=`<div class="dz">${pick?`<p class="hint">Project: <b>${getP(pick).t}</b>. Questions are filled from your project; change them.</p>`:'<p class="hint">Choose a project above first, or sketch freely.</p>'}
    <div class="dz-form"><label>Title (your main message)<input data-f="title" value="${esc(d.title)}" placeholder="e.g. Shawarma wins, and dinner is the rush hour"></label>
    <div class="dz-k">${d.kpi.map((k,i)=>`<label>KPI card ${i+1}<input data-k="${i}" value="${esc(k)}" placeholder="${['Total sales','Number of …','Average …'][i]}"></label>`).join('')}</div>
    ${d.q.map((q,i)=>`<div class="dz-q"><label>Question ${i+1}${i===0?' · main chart':''}<input data-q="${i}" value="${esc(q)}"></label><label>Visual<select data-v="${i}">${VIZ.map(v=>`<option ${v===d.v[i]?'selected':''}>${v}</option>`).join('')}</select></label></div>`).join('')}
    <label>Slicer (filter)<input data-f="slicer" value="${esc(d.slicer)}" placeholder="e.g. Year, City, Category"></label></div>
    <div class="dz-prev"></div><div class="btns"><button type="button" class="p dl">⬇ Download sketch (image)</button><button type="button" class="rs">Start again</button></div>
    <p class="hint">It goes into your report automatically. Then build it in Power BI.</p></div>`;
    const prev=el.querySelector('.dz-prev'), save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} prev.innerHTML=sketch(d); };
    el.querySelectorAll('[data-f]').forEach(i=>i.oninput=()=>{ d[i.dataset.f]=i.value; save(); });
    el.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{ d.kpi[+i.dataset.k]=i.value; save(); });
    el.querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{ d.q[+i.dataset.q]=i.value; save(); });
    el.querySelectorAll('[data-v]').forEach(i=>i.onchange=()=>{ d.v[+i.dataset.v]=i.value; save(); });
    el.querySelector('.rs').onclick=()=>{ d=fresh(); try{ localStorage.removeItem(KEY); }catch(e){} draw(); };
    el.querySelector('.dl').onclick=()=>sketchPNG(d).then(m=>{ const a=document.createElement('a'); a.href=m.src; a.download='dashboard-sketch.jpg'; a.click(); });
    save(); };
  draw(); document.addEventListener('g106proj',()=>{ d=fresh(); draw(); });
}

/* ---------- peer feedback ---------- */
const SURVEY=[
 ['The title tells me the main message.','Rating 1–5'],
 ['I can find the key numbers in 5 seconds.','Rating 1–5'],
 ['Each chart type fits its question.','Rating 1–5'],
 ['The layout is easy to follow (most important first).','Rating 1–5'],
 ['Labels, units and colours are clear.','Rating 1–5'],
 ['The recommendation is convincing.','Rating 1–5'],
 ['What is the strongest part of this dashboard?','Text'],
 ['Name one thing the team should change.','Text'],
 ['Your section','Choice: 201 · 202']];
function survey(el){
  const txt='Peer review · GED 106 project dashboard\n\n'+SURVEY.map(([q,t],i)=>`${i+1}. ${q} (${t})`).join('\n');
  let n=0; try{ n=+localStorage.getItem('g106-reviews')||0; }catch(e){}
  el.innerHTML=`<div class="svq">${SURVEY.map(([q,t])=>`<div>${q} <small>· ${t}</small></div>`).join('')}</div>
   <div class="btns"><button type="button" class="p cp">Copy the questions</button><a class="x" href="https://forms.office.com" target="_blank" rel="noopener">Open Microsoft Forms ↗</a></div>
   <div class="cnt">Reviews received <span class="dots"></span><span class="n"></span><button type="button" class="m" aria-label="One less">−</button><button type="button" class="pl" aria-label="One more">+</button></div>`;
  const paint=()=>{ el.querySelector('.dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join(''); el.querySelector('.n').textContent=n>=10?`${n} · done ✓`:`${n} of 10`; try{ localStorage.setItem('g106-reviews',n); }catch(e){} };
  el.querySelector('.pl').onclick=()=>{ n++; paint(); }; el.querySelector('.m').onclick=()=>{ n=Math.max(0,n-1); paint(); };
  el.querySelector('.cp').onclick=e=>{ try{ navigator.clipboard.writeText(txt); e.target.textContent='Copied ✓'; }catch(x){} };
  paint(); }

Lecture.mount({
  id:'g106-lab11', course:'GED 106', week:11, clo:'4, 3', short:'Project Lab · Choose, Design, Build',
  title:'Project Lab · Choose, Design and Build Your Dashboard',
  meta:'Lab · Week 11 · Drafting project reports',
  scenes:[
  { nav:'Start here', title:'Your project in five steps', kind:'activity', minutes:5, wide:true,
    narration:[`Work in your project team. Choose one project, sketch the dashboard, build it in Power BI, collect 10 peer reviews, then write the report.`],
    src:`Revise: <a href="week-11.html">Week 11 · Dashboards</a> · <a href="lab-powerbi.html">Power BI first steps</a>.`,
    fig:{label:`Watch first · 1-minute guide`, html:`<video controls playsinline preload="metadata" poster="assets/video/lab11-guide.jpg" style="width:100%;border-radius:12px;display:block;background:#000" aria-label="Guide video: the five steps of the project lab, with subtitles"><source src="assets/video/lab11-guide.mp4" type="video/mp4"></video>`, build:el=>{ const d=document.createElement('div'); d.style.marginTop='12px'; el.appendChild(d); W.agenda(d,[[`1 · Choose a project`,15,'a'],[`2 · Sketch the dashboard`,20,'a'],[`3 · Build in Power BI`,45,'a'],[`4 · 10 peer reviews`,20,'a'],[`Submit the draft`,5,'c']]); }} },

  { nav:'Teams', title:'Teams and projects', kind:'activity', minutes:5, wide:true,
    narration:[`One project per team. Write your team name next to your project.`],
    fig:{label:`Who works on which project`, build:teamsTable} },

  { nav:'1 · Choose', title:'Step 1 · Choose your project', kind:'activity', minutes:15, wide:true,
    narration:[`Ten projects per section, all with real open data. Open one, read the guiding questions, then choose it. One project per team.`],
    fig:{label:`Pick your section, then a project`, build:chooser} },

  { nav:'2 · Sketch', title:'Step 2 · Sketch your dashboard', kind:'activity', minutes:20, wide:true,
    narration:[`Plan before you drag. Write the title as a message, three KPI cards, four questions and one visual for each.`],
    fig:{label:`Dashboard sketch tool`, build:designer} },

  { nav:'3 · Build', title:'Step 3 · Build it in Power BI', kind:'activity', minutes:45, wide:true,
    narration:[`Follow the same steps as the Power BI lab, now with your project data.`],
    fig:{label:`Eight steps in Power BI Desktop`, html:`<div class="st">
      <div><b class="h">1 · Get the data</b><ol><li>Download the file from your project link, save it in OneDrive › GED106 › Project</li><li><span class="k">Home</span> → <span class="k">Get data</span> → <span class="k">Text/CSV</span> or <span class="k">Excel workbook</span> → <span class="k">Transform Data</span></li></ol></div>
      <div><b class="h">2 · Clean it</b><ol><li>Check <span class="k">View</span> → <span class="k">Column quality</span></li><li>Fix data types; remove blank rows, duplicates and errors</li><li>Keep only the columns you need (<span class="k">Choose Columns</span>)</li><li>Read your project’s Power BI tip</li></ol></div>
      <div><b class="h">3 · Reshape if needed</b><ol><li>Years or regions as columns? <span class="k">Unpivot Other Columns</span></li><li>Need revenue? <span class="k">Add Column</span> → <span class="k">Custom Column</span></li><li><span class="k">Close &amp; Apply</span></li></ol></div>
      <div><b class="h">4 · Link tables (if you have more than one)</b><ol><li><span class="k">Model view</span>: drag the ID column of one table onto the same column in the other</li></ol></div>
      <div><b class="h">5 · KPI cards</b><ol><li>Visualizations → <span class="k">Card</span>; drag one number field; choose Sum, Average or Count</li><li>Rename it with its unit</li></ol></div>
      <div><b class="h">6 · Four charts from your sketch</b><ol><li>One visual per question, in the same places as your sketch</li><li>Sort bars; keep time in order; one highlight colour</li></ol></div>
