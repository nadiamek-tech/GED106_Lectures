/* deterministic shuffle so the correct option is not always first */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function mix(items,seed){ const r=rng(seed); return items.map(it=>{ const idx=it.o.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } return {q:it.q,o:idx.map(i=>it.o[i]),a:idx.indexOf(it.a),why:it.why}; }); }

const p3=[
 {q:'A data dictionary describes…',o:['each field (column) in a dataset','the meaning of English words','an app’s source code','the people who answered a survey'],a:0,why:'It documents fields: name, type, unit, allowed values, definition, source. It is not a language dictionary, code, or a list of respondents.'},
 {q:'Which is NOT normally part of a data dictionary entry?',o:['The analyst’s opinion of the results','Field name','Data type','Allowed values'],a:0,why:'Name, type and allowed values describe a field. Opinions about results belong in a report.'},
 {q:'“Rating: 1–5, where 5 = strongly agree” is best described as…',o:['ordinal data','continuous data','free text','a date'],a:0,why:'Ordered categories are ordinal. It is not continuous (no in-between values), not text, not a date.'},
 {q:'A field “Major” with values Business, Design, Media is…',o:['categorical','numerical','a date','an identifier'],a:0,why:'Labels for groups are categorical. You cannot calculate with them, and they do not identify one person.'},
 {q:'The dictionary says Hours_studied is 0–80. A value of 230 should be…',o:['flagged as outside the allowed values','accepted as it is','silently changed to 80','deleted with the whole row'],a:0,why:'Flag and check it. Accepting ignores the rule; changing it invents data; deleting loses the other answers.'},
 {q:'Why record a unit such as “minutes” in a data dictionary?',o:['So readers do not misread the values','To make the file smaller','To hide the data','It is not needed'],a:0,why:'Without a unit, 30 could mean minutes or hours. Units do not change file size or hide data.'},
 {q:'The “Source” entry of a field tells you…',o:['where its values came from','the file size','who owns the computer','the chart colour'],a:0,why:'Source records origin, for example “survey question 3” or “added by Forms”.'},
 {q:'Student_ID should be treated as…',o:['an identifier, not a quantity to average','a numerical measure','an ordinal rating','a date'],a:0,why:'IDs label people. Averaging IDs has no meaning, even though they look like numbers.'},
 {q:'Morrow’s four pillars are reading, working with, analysing and…',o:['communicating with data','storing data','selling data','coding data'],a:0,why:'The fourth pillar is communicating with data. Storing, selling and coding are not pillars.'},
 {q:'Raw values organised with context become…',o:['information','wisdom','noise','a sample'],a:0,why:'Data + context = information. Wisdom is higher in the hierarchy; a sample is a subset of a population.'},
 {q:'Which is unstructured data?',o:['A recorded phone call','A table of prices','A list of dates','Exam marks in Excel'],a:0,why:'Audio does not fit rows and columns. The other three are structured tables or lists.'},
 {q:'Support rose from 30% to 36%. This is…',o:['6 percentage points (a 20% relative rise)','6% (a 6 percentage-point rise)','36 percentage points','20 percentage points'],a:0,why:'36 − 30 = 6 points; 6 ÷ 30 = 20% relative. The other options mix up points and percent.'},
 {q:'For house prices with a few very expensive villas, the best “typical” value is the…',o:['median','mean','maximum','range'],a:0,why:'The median resists outliers. The mean is pulled up; the maximum and range do not describe a typical value.'},
 {q:'Two variables rise together. You can conclude that they are…',o:['correlated','causally linked','measured wrongly','random'],a:0,why:'Moving together shows correlation only. Cause needs more evidence; nothing suggests error or randomness.'},
 {q:'Asking “who is missing from this dataset?” is an example of…',o:['critical thinking','creativity only','prescriptive analytics','data storage'],a:0,why:'Questioning a dataset’s coverage is critical thinking. It does not recommend an action or store data.'},
 {q:'The data skills gap is the difference between…',o:['skills employers need and skills workers have','two bars on a chart','missing and complete values','storage space and file size'],a:0,why:'It is a labour-market gap (WEF, 2025), not a chart, data-quality or storage term.'},
 {q:'The UAE Personal Data Protection Law took effect on…',o:['2 January 2022','1 January 2019','1 June 2025','It is not yet in force'],a:0,why:'Federal Decree-Law No. 45 of 2021 took effect on 2 January 2022.'},
 {q:'Under the UAE PDPL, the default legal basis for processing personal data is…',o:['the consent of the data subject','the company’s profit','public curiosity','no basis is needed'],a:0,why:'Consent is the default; a few exceptions exist, such as legal obligations. Profit or curiosity are not legal bases.'},
 {q:'Which right does the UAE PDPL give individuals?',o:['To correct inaccurate personal data','To see other people’s data','To be paid for each use','No rights'],a:0,why:'Rights include access, correction and erasure of one’s own data, not other people’s data or payment.'},
 {q:'Which UAE zones have their own data protection laws?',o:['DIFC and ADGM','Dubai Marina and Al Ain','All emirates equally','None'],a:0,why:'The DIFC and ADGM financial free zones have separate regimes; the federal law does not apply there.'},
 {q:'Replacing names with codes while a key can re-link them is…',o:['pseudonymisation','anonymisation','deletion','encryption of hardware'],a:0,why:'If a key can re-link records, they are pseudonymised. Anonymised data cannot be linked back.'},
 {q:'Re-identification means…',o:['linking “anonymous” records back to a person','deleting a dataset','asking for consent','encrypting a file'],a:0,why:'Combining facts such as birth date and postcode can reveal who someone is (Sweeney, 2000).'},
 {q:'Valid consent should be…',o:['clear, specific and actively given','assumed if the user says nothing','hidden in long terms','given by a friend'],a:0,why:'Silence, hidden terms or someone else’s agreement are not valid consent.'},
 {q:'The whole group you want to draw conclusions about is the…',o:['population','sample','pilot','frame error'],a:0,why:'The population is everyone of interest; the sample is the part you actually ask.'},
 {q:'Every member has an equal chance of selection in a…',o:['simple random sample','convenience sample','volunteer sample','quota sample'],a:0,why:'Only random selection gives everyone an equal chance; the others depend on who is easy to reach or who volunteers.'},
 {q:'Grouping students by year and sampling randomly within each year is…',o:['stratified sampling','cluster sampling','convenience sampling','snowball sampling'],a:0,why:'Random within every group = stratified. Cluster sampling picks whole groups; convenience and snowball are non-random.'},
 {q:'People who reply differ from those who do not. This is…',o:['non-response bias','a leading question','a pilot test','a unit error'],a:0,why:'Bias from who replies is non-response bias (as in the 1936 Literary Digest poll).'},
 {q:'A 1–5 scale from “strongly disagree” to “strongly agree” is a…',o:['Likert scale','open question','ranking question','demographic question'],a:0,why:'Agreement on a fixed scale is a Likert item. Open questions have free text; ranking orders items.'},
 {q:'Testing a survey on a few people before launch is a…',o:['pilot test','census','sampling frame','data dictionary'],a:0,why:'A pilot finds confusing questions early. A census asks everyone; a frame is the list you sample from.'},
 {q:'Surveying only your friends because they are easy to reach is…',o:['convenience sampling','random sampling','stratified sampling','systematic sampling'],a:0,why:'Ease of access, not chance, decides who is asked, so it is convenience sampling.'}];
