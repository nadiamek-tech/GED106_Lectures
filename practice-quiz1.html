<script>
const {W,B}=Lecture;
const MA={label:'Show model answer',prefix:'',numbered:false};
const BOOKS=`<div class="scroll"><table class="tbl"><thead><tr><th>Category</th><th>Share of orders</th><th>Average rating (1–5)</th></tr></thead><tbody>
<tr><td>Fiction</td><td>30%</td><td>4.1</td></tr><tr><td>Textbooks</td><td>28%</td><td>3.6</td></tr><tr><td>Children’s books</td><td>18%</td><td>4.7</td></tr><tr><td>Stationery</td><td>16%</td><td>4.3</td></tr><tr><td>Other</td><td>8%</td><td>3.4</td></tr></tbody></table></div><p class="mono" style="color:var(--muted)">Fictional data.</p>`;

Lecture.mount({
  id:'g106-pq1', course:'GED 106', week:'Practice', clo:'1, 2', short:'Practice · Quiz 1',
  title:'Practice Quiz 1',
  meta:'Practice · Weeks 1–4',
  scenes:[
  { nav:'Part A · MCQs', title:'Part A · MCQs', kind:'check',
    narration:[`Choose one answer. Question 2 accepts two answers.`],
    fig:{label:`Five questions`, build:el=>W.quiz(el,[
      {q:`Which statement best describes data governance?`,o:[`Rules and roles for managing data quality, security and use`,`A style for drawing charts`,`Deleting data after analysis`,`A marketing plan for data products`],a:0,why:`Governance sets who may do what with data, and how quality and security are kept. It is not a chart style, a deletion rule or marketing.`},
      {q:`A hospital links patient feedback forms with appointment records to study waiting times. This represents…`,o:[`Data collection`,`Data integration`,`Data anonymisation`,`Data disposal`],a:[0,1],why:`Both are accepted: the hospital <b>collects</b> data from two sources and <b>integrates</b> them into one view. It does not anonymise or dispose of data.`},
      {q:`Which is good data governance practice?`,o:[`Storing records on a public drive`,`Sharing one password across a team`,`Limiting access according to job role`,`Keeping two versions with different figures`],a:2,why:`Role-based access protects data. Public drives and shared passwords expose it; two conflicting versions break consistency.`},
      {q:`Two departments report different student numbers for the same term. This shows the lack of…`,o:[`a single source of truth`,`predictive modelling`,`data bias`,`a Likert scale`],a:0,why:`Conflicting copies mean there is no single agreed source. It is not about prediction, bias or survey scales.`},
      {q:`Which presentation shows data literacy?`,o:[`Raw numbers with no context`,`A clear chart linked to a decision`,`Technical terms only experts understand`,`A list of the software used`],a:1,why:`Communicating with data means a clear message that supports a decision.`}])} },

  { nav:'Part B · Q6', title:'Part B · Classify each question', kind:'review',
    narration:[`Name the question type and explain why.`],
    fig:{label:`Three questions`, build:el=>W.practice(el,[
      {q:`a) “On a scale of 0–10, how satisfied are you with the shuttle service?”`,hint:`<b>Closed rating-scale question.</b> Answers are numbers on a fixed scale, so they can be counted and averaged.`},
      {q:`b) “Describe one problem you had when registering for courses.”`,hint:`<b>Open-ended question.</b> Students answer in their own words: rich detail, but slower to analyse.`},
      {q:`c) “Surely you agree our new portal is the best in the country?”`,hint:`<b>Leading question.</b> The wording pushes agreement. Neutral: “How would you rate the new portal? (1 = very poor, 5 = very good)”.`}],MA)} },

  { nav:'Part B · Q7', title:'Part B · Improve a survey', kind:'review',
    narration:[`You are designing a satisfaction survey for <b>visitors to a city’s public libraries</b>. Propose a sampling method and one bias to avoid.`],
    fig:{label:`Two parts`, build:el=>W.practice(el,[
      {q:`Sampling method`,hint:`Sample from the <b>population of library visitors</b>, not people in general. Use <b>stratified random sampling</b>: group visitors by branch and time of day, then select randomly within each group, so every type of visitor is represented.`},
      {q:`One bias and how to reduce it`,hint:`<b>Sampling bias:</b> surveying only at one branch or only on weekends misses other visitors; sample across branches and times. (Also accepted: <b>non-response bias</b>; keep the survey short and offer it in several languages.)`}],MA)} },

  { nav:'Part C · Q8', title:'Part C · Read the table', kind:'review', wide:true,
    narration:[`An online bookstore summarised one month of orders.`],
    fig:{label:`Orders by category`, html:BOOKS, build:el=>{ const d=document.createElement('div'); d.style.marginTop='16px'; el.appendChild(d); W.practice(d,[
      {q:`a) Which category contributes most to order volume?`,hint:`<b>Fiction</b>, 30% of orders.`},
      {q:`b) Which category has the highest satisfaction, and why should management notice it?`,hint:`<b>Children’s books</b> (4.7), but only 18% of orders: a strong category to grow.`},
      {q:`c) Suggest one data-driven decision.`,hint:`Textbooks are 28% of orders but rated only 3.6: investigate reviews (price, delivery, editions) and improve them, since a large share of customers is affected.`},
      {q:`d) Which type of analytics is this table?`,hint:`<b>Descriptive</b>: it summarises what happened; it does not explain why, predict or recommend.`}],MA); }} }
  ]
});
</script>
