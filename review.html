<script>
const {W,B}=Lecture;
const T14=`<div class="scroll"><table class="tbl"><thead><tr><th></th><th>Week 1</th><th>Week 2</th><th>Week 3</th><th>Week 4</th></tr></thead><tbody>
<tr><td>Key idea</td><td>Data → information → knowledge</td><td>Four pillars</td><td>Fair sample, fair questions</td><td>Four levels of analytics</td></tr>
<tr><td>Key terms</td><td>Structured, digital economy, skills gap</td><td>Reading, working with, analysing, communicating</td><td>Population, sample, non-response bias, tidy data</td><td>Descriptive, diagnostic, predictive, prescriptive</td></tr>
<tr><td>Evidence</td><td>Rowley (2007); WEF (2025)</td><td>Cleveland &amp; McGill (1984)</td><td>Squire (1988); Loftus &amp; Palmer (1974)</td><td>Lazer et al. (2014)</td></tr></tbody></table></div>`;
const T58=`<div class="scroll"><table class="tbl"><thead><tr><th></th><th>Week 5</th><th>Week 6</th><th>Week 7</th><th>Week 8</th></tr></thead><tbody>
<tr><td>Key idea</td><td>Read before you believe</td><td>Curiosity, creativity, critical thinking</td><td>Five ethics principles</td><td>Common ethical problems</td></tr>
<tr><td>Key terms</td><td>Mean, median, percentage points, data dictionary</td><td>Correlation vs causation</td><td>Consent, re-identification</td><td>Biased data, proxy, cherry-picking</td></tr>
<tr><td>Evidence</td><td>Pandey et al. (2015)</td><td>Snow (1855); Messerli (2012)</td><td>Sweeney (2000); Kosinski et al. (2013)</td><td>Buolamwini &amp; Gebru (2018); Obermeyer et al. (2019)</td></tr></tbody></table></div>`;
const CONF=`<div class="scroll"><table class="tbl"><thead><tr><th>Often confused</th><th>The difference</th></tr></thead><tbody>
<tr><td>Data · information</td><td>Raw values · values organised with context</td></tr>
<tr><td>Population · sample</td><td>Everyone you study · those you actually ask</td></tr>
<tr><td>Sampling bias · non-response bias</td><td>Who is asked · who chooses to reply</td></tr>
<tr><td>Leading · loaded question</td><td>Pushes an answer · assumes a fact</td></tr>
<tr><td>Mean · median</td><td>Sum ÷ count · middle value (robust to outliers)</td></tr>
<tr><td>Percent · percentage points</td><td>Relative change · difference between two percentages</td></tr>
<tr><td>Correlation · causation</td><td>Move together · one changes the other</td></tr>
<tr><td>Predictive · prescriptive</td><td>What will happen · what we should do</td></tr>
<tr><td>Transparency · privacy</td><td>Telling people how data are used · protecting the data</td></tr>
<tr><td>Intention · outcomes</td><td>Why data are collected · what happens to people</td></tr>
<tr><td>Anonymised · de-identified</td><td>Cannot be linked to a person · names removed, may still be linked</td></tr>
</tbody></table></div>`;
const CARDS=[['Data','Recorded observations'],['Information','Data organised with context'],['Structured data','Fits rows and columns'],['Digital economy','Economic activity that depends on digital technology and data'],['Data skills gap','Skills employers need minus skills workers have'],['Four pillars','Reading, working with, analysing, communicating with data'],['Tidy data','One variable per column, one observation per row'],['Non-response bias','Those who reply differ from those who do not'],['Loaded question','Assumes something that may not be true'],['Descriptive analytics','What happened?'],['Diagnostic analytics','Why did it happen?'],['Predictive analytics','What will happen?'],['Prescriptive analytics','What should we do?'],['Data dictionary','Name, type, unit, allowed values, definition, source'],['Median','Middle value of sorted data'],['Percentage points','Difference between two percentages'],['Three Cs','Curiosity, creativity, critical thinking'],['Re-identification','Finding people in data without names'],['Proxy variable','A stand-in for what you want to measure'],['Cherry-picking','Showing only the data that supports a story']];

Lecture.mount({
  id:'g106-rev', course:'GED 106', week:'1–8', clo:'1–3', short:'Midterm review · Weeks 1–8',
  title:'Midterm Review',
  meta:'Weeks 1–8 · Fri 23 Oct, 3 PM',
  scenes:[
  { nav:'Midterm', title:'Midterm · Friday 23 October, 3:00–4:30 PM', kind:'review',
    narration:[`Hub Zones · 90 minutes · closed book · 20 marks. The midterm covers <b>Weeks 1–8</b>. Start with the terms students most often confuse.`],
    fig:{label:`Often confused`, html:CONF} },

  { nav:'Weeks 1–4', title:'Weeks 1–4', kind:'review', wide:true,
    narration:[`Cover a column and recall it.`],
    fig:{label:`Weeks 1–4`, html:T14} },

  { nav:'Weeks 5–8', title:'Weeks 5–8', kind:'review', wide:true,
    narration:[`Cover a column and recall it.`],
    fig:{label:`Weeks 5–8`, html:T58} },

  { nav:'Flashcards', title:'Key terms', kind:'review', wide:true,
    narration:[`Switch on Self-test and work through the cards.`],
    fig:{label:`${CARDS.length} terms`, build:el=>W.flashcards(el,CARDS)} },

  { nav:'Practice', title:'Practice questions', kind:'review',
    narration:[`Answer on paper first, then open the hint.`],
    fig:{label:`Nine questions`, build:el=>W.practice(el,[
      {q:`Distinguish data from information, with one example.`,hint:`Data: raw values (38, 41, 43). Information: organised with context (temperature rose three days in a row).`},
      {q:`What is a data skills gap?`,hint:`The difference between skills employers need and skills workers have; WEF (2025): analytical thinking is the top core skill.`},
      {q:`Why did the 1936 <em>Literary Digest</em> poll fail despite 2.4 million replies?`,hint:`Non-response bias: Landon supporters replied more often (Squire, 1988; Lusinchi, 2012). A large sample does not correct bias.`},
      {q:`What is tidy data? Give two rules.`,hint:`Wickham (2014): each variable a column, each observation a row; one value per cell.`},
      {q:`Which better describes a typical salary, the mean or the median? Why?`,hint:`Median: one very high salary pulls the mean up but barely moves the median.`},
      {q:`List four things a data dictionary records.`,hint:`Name, data type, unit, allowed values, definition, source.`},
      {q:`Chocolate consumption and Nobel prizes correlate (r = 0.79). What can you conclude?`,hint:`Only that they move together; a third factor such as national wealth may drive both (Messerli, 2012).`},
      {q:`Why does removing names not make a dataset anonymous?`,hint:`Combinations of ordinary facts identify people: ZIP code, gender and birth date (Sweeney, 2000); four location points (de Montjoye et al., 2013).`},
      {q:`What is a proxy variable? Give a published example.`,hint:`A stand-in for the quantity of interest; healthcare cost used for health need (Obermeyer et al., 2019).`}])} },

  { nav:'Mixed quiz', title:'Mixed quiz', kind:'check',
    narration:[`Ten questions across Weeks 1–8.`],
    fig:{label:`Ten questions`, build:el=>W.quiz(el,[
      {q:`A voice note is…`,o:[`structured data`,`unstructured data`,`not data`,`a variable`],a:1,why:`Week 1.`},
      {q:`Removing duplicate rows belongs to which pillar?`,o:[`Reading`,`Working with`,`Analysing`,`Communicating`],a:1,why:`Week 2.`},
      {q:`Readers judge which encoding most accurately?`,o:[`Area`,`Colour`,`Position on a common scale`,`Volume`],a:2,why:`Week 2: Cleveland &amp; McGill (1984).`},
      {q:`The main cause of the 1936 Literary Digest error was…`,o:[`a small sample`,`non-response bias`,`a printing error`,`late ballots`],a:1,why:`Week 3.`},
      {q:`Loftus &amp; Palmer (1974) showed that…`,o:[`wording changes answers`,`samples must be large`,`charts mislead`,`data must be cleaned`],a:0,why:`Week 3.`},
      {q:`Support rose from 40% to 50%. That is…`,o:[`+10%`,`+10 percentage points`,`+50%`,`+40 points`],a:1,why:`Week 5.`},
      {q:`One very high value is added. Which measure moves most?`,o:[`Median`,`Mean`,`Mode`,`Number of values`],a:1,why:`Week 5.`},
      {q:`Google Flu Trends failed mainly because…`,o:[`search behaviour changed`,`it had too little data`,`flu cannot be measured`,`it used surveys`],a:0,why:`Week 4: Lazer et al. (2014).`},
      {q:`Sweeney (2000) estimated that ZIP code, gender and birth date identify about…`,o:[`8%`,`37%`,`87%`,`100%`],a:2,why:`Week 7.`},
      {q:`Showing only the months that support your story is…`,o:[`cherry-picking`,`cleaning`,`sampling`,`a proxy`],a:0,why:`Week 8.`}])} },

  { nav:'Excel', title:'Excel functions', kind:'review',
    narration:[`Read each formula aloud, then check its meaning.`],
    fig:{label:`Three formulas`, build:el=>W.practice(el,[
      {q:`=COUNTIF(C2:C40,">=70")`,hint:`Counts cells in C2:C40 with a value of 70 or more.`},
      {q:`=IF(D2="","Missing","OK")`,hint:`Shows “Missing” if D2 is empty, otherwise “OK”.`},
      {q:`=VLOOKUP(A2,Majors!A:B,2,FALSE)`,hint:`Finds A2 exactly in column A of Majors and returns column B.`}],{label:'Show meaning',prefix:'',numbered:false})} }
  ]
});
</script>
</body>
</html>
