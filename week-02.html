<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 2 · The Four Pillars of Data Literacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#2E7D5B;--wk-soft:rgba(46,125,91,.10);--wk-d:#7FD3AA;--wk-soft-d:rgba(127,211,170,.14)}
.scroll{overflow-x:auto}
.lens{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lens button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.88rem}
.lens button[aria-pressed="true"]{border-color:var(--wk);background:var(--wk);color:var(--on-wk)}
.cafe{width:100%;border-collapse:collapse;font-family:var(--f-display);font-size:.86rem}
.cafe th,.cafe td{border:1px solid var(--line);padding:5px 7px;text-align:right}
.cafe th:first-child,.cafe td:first-child{text-align:left}
.cafe th{background:var(--sunk);font-weight:600}
.cafe td.hl{background:var(--wk-soft);outline:2px solid var(--wk);outline-offset:-2px;font-weight:700}
.cafe tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.bars{display:grid;gap:5px;margin-top:8px;font-family:var(--f-display);font-size:.84rem}
.bars div{display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:8px;align-items:center}
.bars i{display:block;height:14px;background:var(--wk);border-radius:3px}
.bars i.lo{background:var(--muted)}
.msg{margin-top:10px;font-family:var(--f-display);font-weight:700;border-left:4px solid var(--wk);padding:6px 10px;background:var(--wk-soft);border-radius:0 8px 8px 0}
.grid{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.74rem}
.grid td,.grid th{border:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
.grid th{background:var(--sunk);font-weight:600}
.grid .bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.grid .rh{color:var(--muted);background:var(--sunk);text-align:center}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:r}
.rank li{counter-increment:r;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;font-family:var(--f-display);font-size:.88rem}
.rank li::before{content:counter(r);font-family:var(--f-mono);font-weight:700;color:var(--wk);text-align:right}
.rank li span{display:flex;justify-content:space-between;gap:8px;width:var(--w);min-width:60%;background:var(--wk-soft);border-left:4px solid var(--wk);border-radius:4px;padding:6px 10px}
.rank li small{color:var(--muted);font-family:var(--f-mono);font-size:.72rem;align-self:center}
@media (max-width:560px){.rank li span{width:100%;flex-direction:column;gap:2px}}
</style>
</head>
<body>
<script src="assets/course.js"></script>
<script>
const {W,B}=Lecture;

/* ---------- one dataset, four pillars (fictional library visits) ---------- */
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const ITEMS={'Floor 1':[64,31,58,60,72],'Floor 2':[40,22,44,41,55],'Floor 3':[35,19,38,36,30]};
function pillars(el){
  const P={
   'Reading':{q:'What does the table say?',do:'Find one fact: <b>72 visitors on Floor 1 on Friday</b>, the highest of any floor on any day.',hl:[['Floor 1',4]]},
   'Working with':{q:'Organise it so it is useful.',do:'Add a <b>daily total</b> row. Now each day can be compared in one number.',tot:true},
   'Analysing':{q:'What pattern, and why?',do:'<b>Tuesday is low on every floor</b> (72 visitors, against 137–157 on other days). Possible reasons to check: a holiday, a campus event, or shorter opening hours.',hl:[['Floor 1',1],['Floor 2',1],['Floor 3',1]],tot:true},
   'Communicating':{q:'Tell someone what matters.',do:'Show the daily totals as a simple chart, with one clear message for the library manager.',chart:true}};
  el.innerHTML=`<div class="lens">${Object.keys(P).map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div><div class="out"></div>`;
  const out=el.querySelector('.out'), bs=el.querySelectorAll('.lens button');
  const tot=DAYS.map((_,d)=>Object.values(ITEMS).reduce((a,v)=>a+v[d],0));
  const show=k=>{ bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k)); const p=P[k];
    const isHl=(it,d)=>(p.hl||[]).some(([a,b])=>a===it&&b===d);
    let html=`<p class="ui" style="margin:0 0 8px"><span class="tag">${k}</span> <b>${p.q}</b> ${p.do}</p>`;
    if(p.chart){ const mx=Math.max(...tot); html+=`<div class="bars">${DAYS.map((d,i)=>`<div><span>${d}</span><i class="${tot[i]<100?'lo':''}" style="width:${tot[i]/mx*100}%"></i><span class="mono">${tot[i]}</span></div>`).join('')}</div><div class="msg">Tuesday visits were about half of other days. Check why before planning next week's staff rota.</div>`; }
    else html+=`<div class="scroll"><table class="cafe"><thead><tr><th>Floor</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${Object.entries(ITEMS).map(([it,v])=>`<tr><td>${it}</td>${v.map((x,d)=>`<td class="${isHl(it,d)?'hl':''}">${x}</td>`).join('')}</tr>`).join('')}${p.tot?`<tr class="tot"><td>Daily total</td>${tot.map(t=>`<td>${t}</td>`).join('')}</tr>`:''}</tbody></table></div>`;
    out.innerHTML=html+`<p class="mono" style="color:var(--muted);margin:8px 0 0">Fictional data for teaching.</p>`; };
  bs.forEach(b=>b.addEventListener('click',()=>show(b.dataset.k))); show('Reading');
}

/* ---------- lab: messy vs tidy table ---------- */
const MESSY=`<div class="scroll"><table class="grid"><tr><th class="rh"></th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
<tr><td class="rh">1</td><td colspan="4" class="bad">CLUB MEMBERS SPRING (merged)</td></tr>
<tr><td class="rh">2</td><td>Name</td><td>Major</td><td>Fee</td><td>Events</td></tr>
<tr><td class="rh">3</td><td>Aisha</td><td>Business</td><td class="bad">50 AED</td><td class="bad">Hike, Quiz night</td></tr>
<tr><td class="rh">4</td><td class="bad"></td><td class="bad"></td><td class="bad"></td><td class="bad"></td></tr>
<tr><td class="rh">5</td><td>Omar</td><td class="bad">bus.</td><td>50</td><td>Quiz night</td></tr>
<tr><td class="rh">6</td><td class="bad">TOTAL</td><td></td><td class="bad">100</td><td></td></tr>
<tr><td class="rh">7</td><td>Lina</td><td>Design</td><td>free?</td><td>Hike</td></tr></table></div>`;
const TIDY=`<div class="scroll"><table class="grid"><tr><th class="rh"></th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
<tr><td class="rh">1</td><td>MemberName</td><td>Major</td><td>Fee_AED</td><td>EventCount</td></tr>
<tr><td class="rh">2</td><td>Aisha</td><td>Business</td><td>50</td><td>2</td></tr>
<tr><td class="rh">3</td><td>Omar</td><td>Business</td><td>50</td><td>1</td></tr>
<tr><td class="rh">4</td><td>Lina</td><td>Design</td><td>0</td><td>1</td></tr></table></div>`;
function tidy(el){
  el.innerHTML=`<div class="lens"><button type="button" data-v="m" aria-pressed="true">Messy sheet</button><button type="button" data-v="t" aria-pressed="false">Tidy sheet</button></div><div class="tv"></div><div id="rules" style="margin-top:12px"></div>`;
  const tv=el.querySelector('.tv'); const bs=el.querySelectorAll('.lens button');
  const set=v=>{ bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); tv.innerHTML=v==='m'?MESSY+'<p class="mono" style="color:var(--bad);margin:6px 0 0">Red cells break a tidy-table rule.</p>':TIDY+'<p class="mono" style="color:var(--good);margin:6px 0 0">One header row · one row per member · one value per cell · numbers only in number columns.</p>'; };
  bs.forEach(b=>b.addEventListener('click',()=>set(b.dataset.v))); set('m');
  W.accordion(el.querySelector('#rules'),[
   {t:'Rule 1 · One header row, no merged cells',d:'Put the title in the file name, not in a merged cell above the table. Excel sorting and filtering break on merged cells.'},
   {t:'Rule 2 · One row = one record',d:'Each member, order or survey response gets exactly one row. No blank rows in the middle.'},
   {t:'Rule 3 · One column = one variable',d:'“Events” held two values in one cell. Store a count, or one row per member per event.'},
   {t:'Rule 4 · Numbers stay numbers',d:'“50 AED” is text to Excel, so it cannot be added. Put the unit in the header: Fee_AED.'},
   {t:'Rule 5 · Same spelling every time',d:'“Business” and “bus.” look like two majors to Excel. Choose one label.'},
   {t:'Rule 6 · No totals inside the data',d:'A TOTAL row in the middle will be counted as a member. Calculate totals below or on another sheet.'}]);
}

const RANK=`<ol class="rank">${[['Position on a common scale','bar chart, dot plot'],['Position on non-aligned scales','small multiples'],['Length · direction · angle','pie chart (angle)'],['Area','bubble chart'],['Volume · curvature','3-D charts'],['Shading · colour saturation','heat map']].map(([a,b],i)=>`<li style="--w:${100-i*14}%"><span><b>${a}</b><small>${b}</small></span></li>`).join('')}</ol><p class="mono" style="color:var(--muted);margin:6px 0 0">Most accurate at the top.</p>`;

Lecture.mount({
  id:'g106-w2', course:'GED 106', week:2, clo:1, short:'Week 2 · The Four Pillars',
  title:'The Four Pillars of Data Literacy',
  meta:'Be Data Literate, Chapter 3 · Lecture',
  scenes:[
  { nav:'Start here', title:'What exactly does a data-literate person do?', minutes:5,
    narration:[`Syllabus topics: <strong>Explaining the 4 Characteristic of Data literacy, reading data, working with data, analysing data , Communicating with data</strong> · CLO-1`],
    src:`Reading: Morrow, J. (2024). <em>Be data literate</em> (2nd ed.). Kogan Page. Chapter 3. Lab reading: Be Data Literate (Morrow, Ch. 1 – "What Is Data Literacy?"; Microsoft Learn: Intro to Excel).`,
    fig:{label:`Lecture · 77 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Hook: which pillar?`,8,'a'],[`The four pillars`,10,'l'],[`One dataset, four pillars`,12,'a'],[`Communicating with data`,12,'l'],[`Sort the tasks`,10,'a'],[`Exam takeaways`,8,'l'],[`Exit check`,12,'c']])} },

  { nav:'Hook', title:'Activity · Who is doing what?', kind:'activity', minutes:8,
    narration:[`Four students use the same grades spreadsheet in four different ways. Identify what Sara is doing.`],
    fig:{label:`Vote`, build:el=>W.poll(el,{q:`Sara reads the sheet and says “My lowest mark is in statistics.” Which pillar is that?`,opts:[`Reading data`,`Working with data`,`Analysing data`,`Communicating with data`],reveal:i=>[`Yes. She understood what the numbers say. That is <b>reading data</b>.`,`Not quite. Working with data means organising it: sorting, cleaning, adding a column.`,`Not quite. Analysing would ask <em>why</em> statistics is lowest, or find a pattern.`,`Not quite. Communicating would be telling her advisor, perhaps with a chart.`][i]+` Now imagine Khalid sorts the sheet by mark (working with), Mariam finds that quiz marks predict final marks (analysing), and Yousef makes a chart for the class (communicating).`})} },

  { nav:'Four pillars', title:'The four pillars of data literacy', minutes:10,
    narration:[`Morrow (2024) defines data literacy through four abilities: reading, working with, analysing and communicating with data. Each builds on the one before.`],
    src:`Morrow, J. (2024). <em>Be data literate</em> (2nd ed.). Kogan Page. Chapter 3.`,
    fig:{label:`The four pillars in order`, flow:[
      {t:'Reading',s:'understand',d:'What does this table or chart say? What do the labels and units mean?'},
      {t:'Working with',s:'organise',d:'Collect, sort, filter, clean and store the data so it can be used.'},
      {t:'Analysing',s:'find meaning',d:'Find patterns, compare groups, and ask why something happened.'},
      {t:'Communicating',s:'share',d:'Tell others what matters, with a clear message and a fair chart.'}]} },

  { nav:'One dataset', title:'Activity · One dataset, four pillars', kind:'activity', minutes:12, wide:true,
    narration:[`Apply each pillar to one week of library visits. The data are fictional.`],
    fig:{label:`Campus library visits · one week · fictional`, build:pillars} },

  { nav:'Communicating', title:'Communicating with data', minutes:12,
    video:{id:'5Zg-C8AAIGg',title:'The beauty of data visualization',by:'David McCandless · TED'},
    narration:[`Readers judge position on a common scale most accurately, then length, angle and area (Cleveland &amp; McGill, 1984). Bar charts therefore compare values better than pie charts.`],
    lit:RANK, litLabel:`Accuracy of visual judgements · Cleveland & McGill (1984)`,
    src:`Cleveland, W. S., &amp; McGill, R. (1984). Graphical perception: Theory, experimentation, and application to the development of graphical methods. <em>Journal of the American Statistical Association, 79</em>(387), 531–554.` },

  { nav:'Sort the tasks', title:'Activity · Which pillar is it?', kind:'activity', minutes:10,
    narration:[`Sort each task into its main pillar, then compare with the suggested answers.`],
    fig:{label:`Sort the tasks`, build:el=>W.sort(el,{buckets:['Reading','Working with','Analysing','Communicating'],items:[
      {t:`Checking what the units are on a chart's y-axis`,a:0,why:`Understanding what the chart shows.`},
      {t:`Removing duplicate survey responses`,a:1,why:`Cleaning and organising data.`},
      {t:`Comparing average marks of morning and evening sections`,a:2,why:`Comparing groups to find a pattern.`},
      {t:`Writing a one-line headline for a chart in your report`,a:3,why:`Sharing the message with a reader.`},
      {t:`Exporting Forms responses to Excel`,a:1,why:`Collecting and managing data.`},
      {t:`Asking why sales fell in March`,a:2,why:`Explaining a pattern: diagnostic thinking (Week 4).`},
      {t:`Presenting a dashboard to a manager`,a:3,why:`Communicating for a decision.`},
      {t:`Reading a weather app's chance-of-rain percentage`,a:0,why:`Interpreting a number correctly.`}]})} },

  { nav:'Exam takeaways', full:true, title:'Exam takeaways · Week 2', kind:'exam', minutes:8,
    narration:[`Revise the mind map, then answer the likely exam questions before opening the hints.`],
    fig:{mindmap:{center:'Four pillars',branches:[{t:'Reading',items:['Understand tables and charts','Check labels and units']},{t:'Working with',items:['Collect and organise','Clean and manage','Tidy tables']},{t:'Analysing',items:['Find patterns','Compare groups','Ask why']},{t:'Communicating',items:['One clear message','Right visual, right audience','Be fair, not misleading']},{t:'Excel structure',items:['Row = one record','Column = one variable','Cell = one value']}]},label:`The week as a mind map · then likely exam questions`, build:el=>W.practice(el,[
      {q:`Name and define the four pillars of data literacy.`,hint:`Reading, working with, analysing, communicating with data; one line each.`},
      {q:`Using one situation (e.g. library visits), give an example of each pillar.`,hint:`Read a value; add totals; find the Tuesday dip and ask why; chart plus a one-line message.`},
      {q:`Why is communicating with data as important as analysing it?`,hint:`Findings only matter if people understand and act; clear message, right visual; risk of misleading charts.`},
      {q:`List three rules of a tidy Excel table and explain why each matters.`,hint:`One header row (sorting works), one value per cell (counting works), numbers without units (sums work).`}])} },

  { nav:'Exit check', title:'Exit check', kind:'check', minutes:12,
    narration:[`<strong>This week's lab:</strong> <a href="lab-02.html">Lab 2 · Fundamentals of Microsoft Forms and Excel →</a>`,`Six questions.`,`<strong>Before Week 3:</strong> read Questback, <em>A beginner's guide to successful online surveys</em>. Think of a topic you would like to survey your classmates about.`],
    fig:{label:`Six questions`, build:el=>W.quiz(el,[
      {q:`Cleaning duplicate rows belongs to which pillar?`,o:[`Reading`,`Working with`,`Analysing`,`Communicating`],a:1,why:`Organising and cleaning data is working with it.`},
      {q:`“Why did sales fall in March?” is mainly…`,o:[`reading`,`working with`,`analysing`,`communicating`],a:2,why:`Explaining a pattern is analysis.`},
      {q:`Which is the strongest way to communicate a finding?`,o:[`Send the full table`,`One clear message plus a simple chart`,`Use as many colours as possible`,`Hide the numbers`],a:1,why:`Lead with the point, show the evidence.`},
      {q:`In a tidy Excel table, one row is…`,o:[`one variable`,`one record`,`one sheet`,`one chart`],a:1,why:`Each row is one person, order or response.`},
      {q:`Why is “50 AED” in a Fee column a problem?`,o:[`It is too long`,`Excel treats it as text, so it cannot be summed`,`AED is not allowed`,`It is not a problem`],a:1,why:`Put the unit in the header and keep the cell a number.`},
      {q:`Microsoft Forms is mainly used to…`,o:[`collect responses`,`build dashboards`,`store files`,`write reports`],a:0,why:`Forms collects; Excel organises and analyses.`}])} }
  ]
});
</script>
</body>
</html>
