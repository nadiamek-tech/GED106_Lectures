<style>
:root{--wk:#B4562F;--wk-soft:rgba(180,86,47,.10);--wk-d:#F2A07E;--wk-soft-d:rgba(242,160,126,.14)}
.scroll{overflow-x:auto}
.seg2{display:flex;flex-wrap:wrap;gap:6px}
.seg2 button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.86rem}
.seg2 button[aria-pressed="true"]{border-color:var(--wk);background:var(--wk);color:var(--on-wk)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.res div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:var(--f-display);font-size:.84rem}

<script>
const {W,B}=Lecture;

/* ---------- 1936-style non-response simulation (constructed model) ----------
   Population: 61% Roosevelt. Self-selected mode: Landon supporters reply at 33%, Roosevelt supporters at 17%,
   so replies are Roosevelt with probability 0.61*0.17 / (0.61*0.17 + 0.39*0.33) ≈ 44.6%. */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function poll(el){
  el.innerHTML=`<div class="ui stack">
   <div><span class="mono" style="color:var(--muted)">WHO ENDS UP IN THE SAMPLE</span><div class="seg2" id="mode"><button type="button" data-m="self" aria-pressed="true">Only those who choose to reply</button><button type="button" data-m="rand" aria-pressed="false">Random sample, all reply</button></div></div>
   <label for="n">Number of replies: <b id="nv"></b></label><input type="range" id="n" min="0" max="5" step="1" value="2">
   <button type="button" class="btn" id="go">Run the poll again</button>
   <div class="res"><div><span class="mono">POLL SAYS ROOSEVELT</span><b id="p"></b></div><div><span class="mono">TRUE RESULT</span><b>61%</b></div></div>
   <div class="feedback" id="fb"></div>
   <p class="mono" style="color:var(--muted);margin:0">Constructed model: Landon supporters reply at 33%, Roosevelt supporters at 17%.</p></div>`;
  const NS=[100,500,2000,10000,50000,200000]; let mode='self', seed=7;
  const pSelf=0.61*0.17/(0.61*0.17+0.39*0.33);
  const run=()=>{ const n=NS[+el.querySelector('#n').value]; el.querySelector('#nv').textContent=n.toLocaleString('en');
    const r=rng(seed); let yes=0; const p=mode==='self'?pSelf:0.61;
    for(let i=0;i<n;i++){ if(r()<p) yes++; }
    const pct=yes/n*100; el.querySelector('#p').textContent=pct.toFixed(1)+'%';
    const err=Math.abs(pct-61);
    el.querySelector('#fb').innerHTML= mode==='self'
      ? `<b>Off by ${err.toFixed(1)} points.</b> ${n>=10000?'More replies, same error: non-response bias does not shrink with size.':'Increase the number of replies. Does the error shrink?'}`
      : `<b>Off by ${err.toFixed(1)} points.</b> ${n<=500?'Small random samples vary, but not in one direction.':'A large random sample lands close to the true result.'}`; };
  el.querySelectorAll('#mode button').forEach(b=>b.addEventListener('click',()=>{ mode=b.dataset.m; el.querySelectorAll('#mode button').forEach(x=>x.setAttribute('aria-pressed',x===b)); run(); }));
  el.querySelector('#n').addEventListener('input',run);
  el.querySelector('#go').addEventListener('click',()=>{ seed=(seed*31+17)>>>0; run(); });
  run();
}

/* ---------- data cleaning preview ---------- */
const RAW=[['Dubai','19','Business'],['dubai ','nineteen','business'],['DXB','20',''],['Sharjah','230','Design'],['Dubai','19','Business']];
const FIX=[['Dubai','19','Business',''],['Dubai','19','Business','same as row 1? check'],['Dubai','20','(missing)','follow up or leave blank'],['Sharjah','?','Design','230 is impossible: check'],['—','—','—','exact duplicate: remove']];
function cleanDemo(el){
  el.innerHTML=`<div class="seg2" style="margin-bottom:10px"><button type="button" data-v="r" aria-pressed="true">Raw responses</button><button type="button" data-v="c" aria-pressed="false">After cleaning</button></div><div class="cv scroll"></div>`;
  const cv=el.querySelector('.cv'), bs=el.querySelectorAll('.seg2 button');
  const set=v=>{ bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
    cv.innerHTML= v==='r'
     ? `<table class="clean"><tr><th>#</th><th>City</th><th>Age</th><th>Major</th></tr>${RAW.map((r,i)=>`<tr><td>${i+1}</td>${r.map((c,j)=>`<td class="${(i===1)||(i===2&&(j===0||j===2))||(i===3&&j===1)||(i===4)?'bd':''}">${c===''?'&nbsp;':c.replace(/ $/,'␣')}</td>`).join('')}</tr>`).join('')}</table><p class="mono" style="color:var(--muted)">␣ = an invisible extra space. Red = a problem.</p>`
     : `<table class="clean"><tr><th>#</th><th>City</th><th>Age</th><th>Major</th><th>Action</th></tr>${FIX.map((r,i)=>`<tr><td>${i+1}</td>${r.map((c,j)=>`<td class="${j<3&&RAW[i][j]!==c?'fx':''}">${c}</td>`).join('')}</tr>`).join('')}</table><p class="mono" style="color:var(--muted)">Green = changed. Some problems need a human decision, not a formula.</p>`; };
  bs.forEach(b=>b.addEventListener('click',()=>set(b.dataset.v))); set('r');
}

Lecture.mount({
  id:'g106-w3', course:'GED 106', week:3, clo:3, short:'Week 3 · Data Collection & Surveys',
  title:'Data Collection & Surveys',
  meta:'Questback guide · Lecture',
  scenes:[
  { nav:'Start here', title:'How do you collect data you can trust?', minutes:5,
    narration:[`Syllabus topics: <strong>Survey design, Choosing the right Questions for a A Survey; Data Cleaning Concept</strong> · CLO-3`],
    src:`Reading: Questback. (n.d.). <em>A beginner's guide to successful online surveys.</em> Lab reading: Data Literacy in Practice (Klidas &amp; Hanegan, Ch. 6 – "From Collection to Insight").`,
    fig:{label:`Lecture · 85 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Hook: the famous wrong poll`,8,'a'],[`Survey design`,12,'l'],[`Sampling bias simulator`,12,'a'],[`Choosing the right questions`,10,'l'],[`Question doctor`,10,'a'],[`Data cleaning concept`,8,'l'],[`Exam takeaways`,8,'l'],[`Exit check`,12,'c']])} },

  { nav:'Hook', title:'Activity · The poll of 2.4 million people', kind:'activity', minutes:8,
    narration:[`In 1936 the <em>Literary Digest</em> mailed about 10 million ballots and received about 2.4 million replies. Predict how accurate its forecast was.`],
    src:`Case facts: DS100 course notes, <em>Sampling</em> (UC Berkeley); widely documented in statistics textbooks.`,
    fig:{label:`Predict`, build:el=>W.poll(el,{q:`With 2.4 million answers, how accurate was the Literary Digest poll?`,opts:[`Almost perfect`,`A little off, by 1–2 points`,`It predicted the wrong winner`,`It was cancelled`],reveal:i=>(i===2?`<b>Correct.</b> `:`<b>Not quite.</b> `)+`The poll predicted that Alf Landon would win, with only about 43% for Franklin D. Roosevelt. Roosevelt won with about 61% of the vote. Only about a quarter of people replied, and Landon supporters replied more often: later research identifies this non-response bias as the main cause (Squire, 1988; Lusinchi, 2012). Gallup's much smaller sample came closer.`})} },

  { nav:'Survey design', title:'Survey design', minutes:12,
    narration:[`A survey studies a sample to describe a population. Quality depends on a clear objective, a frame that covers the population, neutral questions and a pilot test (Questback, n.d.).`],
    src:`Questback. (n.d.). <em>A beginner's guide to successful online surveys.</em>`,
    fig:{label:`Five steps of survey design`, flow:[
      {t:'Objective',s:'why?',d:'Write one sentence: what decision will this survey help with?'},
      {t:'Who',s:'population · sample',d:'Define the population. Plan how to reach a sample that represents it.'},
      {t:'Questions',s:'what?',d:'Ask only what serves the objective. Choose question types on purpose.'},
      {t:'Pilot',s:'test it',d:'Ask three people to take it and tell you what was confusing. Fix it.'},
      {t:'Collect',s:'send',d:'Share the link, explain the purpose, give a deadline, and protect privacy.'}]} },

  { nav:'Sampling bias', title:'Activity · Sampling bias simulator', kind:'activity', minutes:12, wide:true,
    video:{id:'Rf-fIpB4D50',title:'Sampling Methods and Bias with Surveys: Crash Course Statistics #10',by:'CrashCourse'},
    narration:[`The 1936 <em>Literary Digest</em> poll received 2.4 million replies yet predicted the wrong winner. Non-response bias explained most of the error (Squire, 1988; Lusinchi, 2012). Size does not correct bias.`],
    chart:{rows:[['Non-response bias',13.7],['Sampling-frame bias',5.9],['Total error',19.6]],unit:' pts',max:20,hl:0,note:'Error decomposition estimated by Lusinchi (2012).'}, litLabel:`Sources of the 19.6-point error`,
    src:`Squire, P. (1988). Why the 1936 Literary Digest poll failed. <em>Public Opinion Quarterly, 52</em>(1), 125–133. Lusinchi, D. (2012). “President” Landon and the 1936 Literary Digest poll: Were automobile and telephone owners to blame? <em>Social Science History, 36</em>(1), 23–54.`,
    fig:{label:`Self-selected vs random replies · constructed model`, build:poll} },

  { nav:'Right questions', title:'Choosing the right questions for a survey', minutes:10,
    narration:[`Wording changes answers. Participants who heard “smashed” estimated higher speeds than those who heard “contacted”, for the same film (Loftus &amp; Palmer, 1974).`],
    chart:{rows:[['smashed',40.8],['collided',39.3],['bumped',38.1],['hit',34.0],['contacted',31.8]],unit:' mph',max:45,hl:0,note:'Mean speed estimates, Experiment 1 (n = 45).'}, litLabel:`Same film, different verb · Loftus & Palmer (1974)`,
    src:`Loftus, E. F., &amp; Palmer, J. C. (1974). Reconstruction of automobile destruction: An example of the interaction between language and memory. <em>Journal of Verbal Learning and Verbal Behavior, 13</em>(5), 585–589.`,
    fig:{label:`Diagnose each question`, build:el=>W.sort(el,{buckets:['Leading','Double-barrelled','Loaded','Vague','Good'],items:[
      {t:`“Online classes are clearly less effective, aren't they?”`,a:0,why:`The tag question pushes towards agreement. Better: “How effective are online classes for you? (1–5)”.`},
      {t:`“How satisfied are you with the gym's equipment and opening hours?”`,a:1,why:`Two questions in one. Ask about equipment and hours separately.`},
      {t:`“How often do you use AI to write your assignments?”`,a:2,why:`Assumes you do. Better: first ask “Have you used AI for an assignment this semester?”, then ask how often.`},
      {t:`“Do you exercise regularly?”`,a:3,why:`“Regularly” means different things. Better: “How many days did you exercise last week? (0–7)”.`},
      {t:`“Which campus building do you spend the most time in? (list)”`,a:4,why:`Clear, neutral, one thing, and easy to analyse.`},
      {t:`“Most students love the new app. Do you?”`,a:0,why:`Social pressure. Better: “How would you rate the new app? (1–5)”.`},
      {t:`“How many hours did you sleep last night?”`,a:4,why:`Clear and specific, with a time frame.`}]})} },

  { nav:'Data cleaning concept', title:'The data cleaning concept', minutes:8,
    narration:[`Cleaning fixes inconsistent labels, formats, missing values, duplicates and impossible values before analysis. The goal is tidy data: one variable per column, one observation per row (Wickham, 2014).`],
    src:`Wickham, H. (2014). Tidy data. <em>Journal of Statistical Software, 59</em>(10), 1–23.`,
    fig:{label:`Five responses · before and after`, build:cleanDemo} },

  { nav:'Exam takeaways', full:true, title:'Exam takeaways · Week 3', kind:'exam', minutes:8,
    narration:[`Revise the mind map, then answer the likely exam questions before opening the hints.`],
    fig:{mindmap:{center:'Surveys',branches:[{t:'Design steps',items:['Objective','Population and sample','Questions → pilot → collect']},{t:'Sampling bias',items:['Literary Digest 1936','Non-response bias: main cause','Size does not fix bias']},{t:'Question faults',items:['Leading','Double-barrelled','Loaded','Vague']},{t:'Question types',items:['Closed and rating: count','Open: reasons','Numeric: averages']},{t:'Cleaning concept',items:['Labels, formats, blanks','Duplicates, outliers','Record every change']}]},label:`The week as a mind map · then likely exam questions`, build:el=>W.practice(el,[
      {q:`Explain the difference between a population and a sample, with an example.`,hint:`Population = all CUD students; sample = the 120 who answered; sample should represent the population.`},
      {q:`What went wrong with the 1936 Literary Digest poll?`,hint:`Non-response bias: Landon supporters replied more often (main cause, Squire 1988; Lusinchi 2012); a biased mailing list added to the error; 2.4 million replies, still the wrong winner; size does not fix bias.`},
      {q:`Rewrite this question: “How often do you skip breakfast before class?”`,hint:`Loaded: it assumes you skip breakfast. First ask “Do you usually eat breakfast before class? (Yes/No)”, then ask how often.`},
      {q:`What is data cleaning, and why is it an ethical as well as a technical task?`,hint:`Fix errors before analysis; judgement involved; never delete inconvenient answers; document changes.`}])} },

  { nav:'Exit check', title:'Exit check', kind:'check', minutes:12,
    narration:[`<strong>This week's lab:</strong> <a href="lab-03.html">Lab 3 · Survey Design Using Microsoft Forms →</a>`,`Six questions.`,`<strong>Before Week 4:</strong> read <em>Be Data Literate</em>, Chapter 2. Make sure your group's survey is ready to send.`],
    fig:{label:`Six questions`, build:el=>W.quiz(el,[
      {q:`A survey sent only to students in the library at 9 pm has…`,o:[`no bias`,`sampling bias`,`a leading question`,`too many questions`],a:1,why:`Late-night library users are not representative of all students.`},
      {q:`Increasing a biased sample from 10,000 to 1,000,000…`,o:[`removes the bias`,`does not remove the bias`,`always doubles accuracy`,`makes it random`],a:1,why:`More of the wrong people still gives the wrong answer.`},
      {q:`“How satisfied are you with the food and the prices?” is…`,o:[`leading`,`double-barrelled`,`vague`,`a good question`],a:1,why:`It asks two things at once.`},
      {q:`Which question type is easiest to count and chart?`,o:[`Open text`,`Closed / multiple choice`,`Voice note`,`Essay`],a:1,why:`Fixed options turn directly into counts and percentages.`},
      {q:`“dubai ”, “Dubai” and “DXB” in one column is a problem of…`,o:[`duplicates`,`inconsistent labels`,`outliers`,`sampling bias`],a:1,why:`Same meaning, different text: Excel sees three categories.`},
      {q:`The first step of survey design is…`,o:[`choosing colours`,`writing a clear objective`,`sending the link`,`making a chart`],a:1,why:`Everything else depends on why you are asking.`}])} }
  ]
});
</script>
