<title>Week 8 · Data Ethics 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{--wk:#A3333D;--wk-soft:rgba(163,51,61,.10);--wk-d:#F2939B;--wk-soft-d:rgba(242,147,155,.14)}
.seg2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg2 button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.86rem}
.seg2 button[aria-pressed="true"]{border-color:var(--wk);background:var(--wk);color:var(--on-wk)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.cmp div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-family:var(--f-display);font-size:.84rem}
.cmp b{display:block;font-size:1.6rem;line-height:1.1}
.claim{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:6px 0}

/* micro-credentials map (activity) */
.cmap{width:100%;border-collapse:collapse;font-family:var(--f-display);font-size:.88rem}
.cmap th{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.cmap td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmap td:first-child{font-weight:800;color:var(--wk)}
.cmap tr.grp td{background:var(--sunk);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
.cmap .prov{display:inline-block;white-space:nowrap;border-radius:999px;padding:1px 8px;font-size:.74rem;font-weight:700;color:#fff}
.cmap .p-ibm{background:#1F6F8B}.cmap .p-pbi{background:#B4562F}.cmap .p-m365{background:#2E7D5B}.cmap .p-all{background:var(--muted)}
.cmap a.go{font-weight:700;white-space:nowrap}
.cstart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;font-family:var(--f-display)}
.cstart div{border:1px solid var(--line);border-top:4px solid var(--wk);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:.9rem}
.cstart b{display:block;margin-bottom:4px}
.cstart a{font-weight:700}
@media (max-width:760px){.cstart{grid-template-columns:minmax(0,1fr)}.cmap th:nth-child(3),.cmap td:nth-child(3){display:none}}
.cfree{font-family:var(--f-display);font-size:.9rem;margin:0 0 10px;color:var(--muted)}

<script>
const {W,B}=Lecture;

/* ---------- proxy variable demo (constructed; mechanism as in Obermeyer et al., 2019) ---------- */
function proxyData(){ let s=99; const r=()=>{ s=(s*1103515245+12345)>>>0; return s/4294967296; };
  const P=[]; for(let i=0;i<1000;i++){ const g=i<500?'A':'B'; const need=Math.round(20+r()*60+ (r()<.15?20:0)); const access=g==='A'?1:0.7; const cost=Math.round(need*access*100*(0.85+r()*0.3)); P.push({g,need,cost}); } return P; }
const PX=proxyData();
function proxy(el){
  el.innerHTML=`<p class="ui" style="margin:0 0 6px">A care programme has places for the top <b>20%</b> of 1,000 patients. Groups A and B are equally sick on average, but group B has less access to care, so less money is spent on them.</p>
   <div class="seg2"><button type="button" data-m="cost" aria-pressed="true">Rank by past cost (the proxy)</button><button type="button" data-m="need" aria-pressed="false">Rank by actual health need</button></div>
   <div class="cmp"><div><span class="mono">GROUP A SELECTED</span><b id="pa"></b></div><div><span class="mono">GROUP B SELECTED</span><b id="pb"></b></div></div>
   <div class="feedback" id="pf" style="margin-top:8px"></div><p class="mono" style="color:var(--muted)">Constructed data generated in the page. It copies the mechanism reported by Obermeyer et al. (2019), not their numbers.</p>`;
  const run=m=>{ el.querySelectorAll('.seg2 button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
    const top=[...PX].sort((a,b)=>b[m]-a[m]).slice(0,200); const a=top.filter(p=>p.g==='A').length, b=200-a;
    el.querySelector('#pa').textContent=a; el.querySelector('#pb').textContent=b;
    const sickB=PX.filter(p=>p.g==='B'&&p.need>=60).length, sickA=PX.filter(p=>p.g==='A'&&p.need>=60).length;
    el.querySelector('#pf').innerHTML= m==='cost'?`Group B gets <b>${b}</b> of 200 places, although it has about as many very sick patients (${sickB}) as group A (${sickA}). Nobody used “group” in the model: <b>cost</b> carried the unfairness in.`:`Ranking by real need gives a roughly fair split. The problem was the <b>choice of target</b>, not the maths.`; };
  el.querySelectorAll('.seg2 button').forEach(b=>b.addEventListener('click',()=>run(b.dataset.m))); run('cost');
}

/* ---------- cherry-picking tool (fictional monthly data) ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const VIS=[410,432,455,440,470,402,365,380,498,520,505,515,530,548,560,541,575,492,455,470,600,628,612,640];
function cherry(el){
  el.innerHTML=`<div class="ui stack"><div class="claim" id="cc"></div>
   <label for="cs">Start month: <b id="csv"></b></label><input type="range" id="cs" min="0" max="22" value="13">
   <label for="ce">End month: <b id="cev"></b></label><input type="range" id="ce" min="1" max="23" value="18">
   <div id="cch"></div><div class="feedback" id="cf"></div><p class="mono" style="color:var(--muted);margin:0">Fictional monthly visitors to a campus gym over two years.</p></div>`;
  const lab=i=>MON[i%12]+' Y'+(1+Math.floor(i/12));
  const draw=()=>{ let s=+el.querySelector('#cs').value, e=+el.querySelector('#ce').value; if(e<=s){ e=s+1; el.querySelector('#ce').value=e; }
    el.querySelector('#csv').textContent=lab(s); el.querySelector('#cev').textContent=lab(e);
    const ch=(VIS[e]-VIS[s])/VIS[s]*100, all=(VIS[23]-VIS[0])/VIS[0]*100;
    el.querySelector('#cc').textContent=`“Gym visits ${ch<0?'FELL':'ROSE'} ${Math.abs(ch).toFixed(0)}%!”`;
    const X=i=>30+i*22.6, Y=v=>150-(v-340)/(660-340)*130;
    el.querySelector('#cch').innerHTML=`<svg viewBox="0 0 560 175" role="img" aria-label="Line chart of 24 months of gym visits with the selected window highlighted"><rect x="${X(s)}" y="12" width="${X(e)-X(s)}" height="140" fill="var(--wk-soft)"/>
      <polyline points="${VIS.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="2"/>
      <polyline points="${VIS.slice(s,e+1).map((v,i)=>`${X(s+i)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--wk)" stroke-width="3.5"/>
      <text x="${X(0)}" y="170" font-size="10" class="t-muted t-mono">Jan Y1</text><text x="${X(23)}" y="170" font-size="10" text-anchor="end" class="t-muted t-mono">Dec Y2</text></svg>`;
    el.querySelector('#cf').innerHTML=`Over the <b>full two years</b>, visits rose ${all.toFixed(0)}%. Every month shown is real (fictional) data, but choosing the window changes the story. Try making a “falling” headline.`; };
  el.querySelector('#cs').addEventListener('input',draw); el.querySelector('#ce').addEventListener('input',draw); draw();
}

const FIVE=`<table class="tbl"><thead><tr><th>Problem</th><th>Check</th></tr></thead><tbody><tr><td>Biased data</td><td>Who is missing from the data?</td></tr><tr><td>Proxy variable</td><td>Are we measuring what we care about?</td></tr><tr><td>Misleading presentation</td><td>Full range, honest axis, a comparison</td></tr><tr><td>Privacy and security</td><td>Who can identify or open the data?</td></tr><tr><td>Over-collection</td><td>Is every field needed?</td></tr></tbody></table>`;


/* micro-credentials: every week of the course mapped to a free unit (data in assets/credentials.js) */
const CREDMAP=()=>{ const C=window.COURSE_CREDS; if(!C) return '';
  const T={1:'The world of data',2:'The four pillars of data literacy',3:'Data collection and surveys',4:'The four levels of analytics',5:'Reading and speaking data',6:'The three Cs of data literacy',7:'Data ethics 1',8:'Data ethics 2',9:'Data-informed decision-making',10:'Charts and graphics',11:'Data visualization and storytelling',12:'Begin your data and analytics journey',13:'Planning capstone projects',14:'Developing data projects',15:'Project presentations'};
  const PATH={"4": "https://learn.microsoft.com/en-us/training/paths/data-analytics-microsoft/", "9": "https://learn.microsoft.com/en-us/training/paths/data-analytics-microsoft/", "10": "https://learn.microsoft.com/en-us/training/paths/build-power-bi-visuals-reports/", "11": "https://learn.microsoft.com/en-us/training/paths/build-power-bi-visuals-reports/", "12": "https://learn.microsoft.com/en-us/training/paths/build-power-bi-visuals-reports/", "13": "https://learn.microsoft.com/en-us/training/paths/build-power-bi-visuals-reports/"};
  const row=w=>{ const x=C.weeks[w], b=C.badges.find(y=>y.id===x.b), u=PATH[w]||x.url; return `<tr><td>${String(w).padStart(2,'0')}</td><td>${T[w]}</td><td>${x.mod}</td><td><span class="prov p-${x.b}">${b?b.prov:'All'}</span></td><td><a class="go" href="${u}"${/^http/.test(u)?' target="_blank" rel="noopener"':''}>Open ↗</a></td></tr>`; };
  const ws=Object.keys(C.weeks).map(Number);
  return `<p class="cfree"><b>Optional · not graded · free only.</b> Take a unit only if it is free. If a page asks you to pay, stop: you do not need it.</p><div class="scroll"><table class="cmap"><thead><tr><th>Wk</th><th>What we studied</th><th>Free unit</th><th>From</th><th></th></tr></thead><tbody>
    <tr class="grp"><td colspan="5">Weeks 1–8 · catch up by Week 11</td></tr>${ws.filter(w=>w<=8).map(row).join('')}
    <tr class="grp"><td colspan="5">Weeks 9–15 · one unit with each lecture</td></tr>${ws.filter(w=>w>8).map(row).join('')}</tbody></table></div>
    <p class="mono" style="color:var(--muted);margin:8px 0 0">${C.badges.map(b=>`${b.prov}: ${b.name} (${b.proof}) by Week ${b.done}`).join(' · ')}</p>
    <div class="cstart">
      <div><b>1 · Sign in now</b><a href="https://skillsbuild.org/college-students/course-catalog/data-fundamentals" target="_blank" rel="noopener">IBM SkillsBuild ↗</a> (free account, then link Credly) and <a href="https://learn.microsoft.com/en-us/training/" target="_blank" rel="noopener">Microsoft Learn ↗</a> with your CUD Microsoft 365 account.</div>
      <div><b>2 · Start in class</b>Open Week 1 (OneDrive) and Week 2 (IBM Data Fundamentals) above. Tick Done on <a href="credentials.html">My Credentials</a>.</div>
      <div><b>3 · Keep going</b>Catch up Weeks 1–8 by Week 11, then one unit each week. Submit each proof for a class-activity bonus.</div>
    </div>`; };
Lecture.mount({
  id:'g106-w8', course:'GED 106', week:8, clo:1, short:'Week 8 · Data Ethics 2',
  title:'Data Ethics -2',
  meta:'Be Data Literate, Chapter 4 · Midterm week · 2-hour session',
  scenes:[
  { nav:'Start here', title:'How does data harm people when nobody means to?', minutes:4,
    narration:[`Syllabus topic: <strong>Common Ethical Problems in Data</strong> · CLO-1`],
    src:`Reading: Morrow, J. (2024). <em>Be data literate</em> (2nd ed.). Kogan Page. Chapter 4.`,
    fig:{label:`Today's session · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,4,'l'],[`Hook`,4,'a'],[`Biased data`,8,'l'],[`Proxy variables`,10,'a'],[`Misleading presentation`,10,'a'],[`Privacy and security`,6,'l'],[`Ethics check for your project`,8,'a'],[`Exam takeaways`,5,'l'],[`Exit check`,5,'c'],[`Midterm revision · practice paper`,60,'a']])} },

  { nav:'Hook', title:'Activity · Can a computer be biased?', kind:'activity', minutes:4,
    narration:[`Decide whether a system that follows its data exactly can still produce unfair results.`],
    fig:{label:`Vote`, build:el=>W.poll(el,{q:`A computer follows the data exactly. Can its decisions still be unfair?`,opts:[`No, computers are neutral`,`Yes, if the data is unfair`,`Only if someone programs it to be`,`Not sure`],reveal:i=>(i===1?`<b>Yes.</b> `:``)+`A system that learns from the past learns the past's unfairness too. And a fair-looking variable can carry unfairness in, as the next two scenes show.`})} },

  { nav:'Biased data', title:'Problem 1 · Biased data', minutes:8,
    video:{id:'UG_X_7g63rY',title:`How I'm fighting bias in algorithms`,by:'Joy Buolamwini · TED'},
    narration:[`Biased data under-represent some groups. Commercial gender classifiers erred up to 34.7% for darker-skinned women but at most 0.8% for lighter-skinned men (Buolamwini &amp; Gebru, 2018).`],
    chart:{rows:[['Darker-skinned women',34.7],['Lighter-skinned men',0.8]],unit:'%',max:40,hl:0,note:'Maximum error rates across three commercial classifiers.'}, litLabel:`Error rates · Buolamwini & Gebru (2018)`,
    src:`Buolamwini, J., &amp; Gebru, T. (2018). Gender shades: Intersectional accuracy disparities in commercial gender classification. <em>Proceedings of Machine Learning Research, 81</em>, 77–91.` },

  { nav:'Proxy variables', title:'Problem 2 · Proxy variables', kind:'activity', minutes:10, wide:true,
    narration:[`A proxy stands in for what we want to measure. An algorithm used healthcare cost as a proxy for need, which under-selected Black patients (Obermeyer et al., 2019).`],
    chart:{rows:[['Algorithm as used',17.7],['Bias removed',46.5]],unit:'%',max:50,hl:1,note:'Share of Black patients among those automatically identified for extra care.'}, litLabel:`Obermeyer et al. (2019)`,
    src:`Obermeyer, Z., Powers, B., Vogeli, C., &amp; Mullainathan, S. (2019). Dissecting racial bias in an algorithm used to manage the health of populations. <em>Science, 366</em>(6464), 447–453.`,
    fig:{label:`Who gets the care places? · constructed data`, build:proxy} },

  { nav:'Misleading', title:'Problem 3 · Misleading presentation', kind:'activity', minutes:10, wide:true,
    narration:[`True numbers can mislead through a cherry-picked time window, a truncated axis or a missing comparison. Find a window on the right that reverses the trend.`],
    src:`Pandey et al. (2015). Morrow (2024), Chapter 4.`,
    fig:{label:`Pick a window, write a headline · fictional data`, build:cherry} },

  { nav:'Privacy + security', title:'Problems 4 and 5 · Privacy, security and over-collection', minutes:6,
    video:{id:'_2u_eHHzRto',title:'The era of blind faith in big data must end',by:`Cathy O'Neil · TED`},
    narration:[`Collect only what the purpose requires and limit who can open the data. The table summarises this week's five problems.`],
    lit:FIVE, litLabel:`Five problems and their checks`,
    src:`Morrow (2024), Chapter 4. O'Neil, C. (2016). <em>Weapons of math destruction</em>. Crown.` },

  { nav:'Ethics check', title:'Activity · Ethics check for your project', kind:'activity', minutes:8,
    narration:[`Run the five checks on your group project survey.`],
    fig:{label:`Five checks · one per problem`, build:el=>W.worksheet(el,{id:'g106-w8-ethics',title:'GED 106 · Week 8 · Project ethics check',fields:[
      {l:'1 · Biased data: who is missing from our sample?',rows:2},
      {l:'2 · Proxy: are we measuring what we really care about?',rows:2},
      {l:'3 · Presentation: what full range or comparison will we show?',rows:2},
      {l:'4 · Privacy and security: which columns could identify someone, and who can open our file?',rows:2},
      {l:'5 · Over-collection: which question could we delete?',rows:2}]})} },

  { nav:'Exam takeaways', full:true, title:'Exam takeaways · Week 8', kind:'exam', minutes:5,
    narration:[`Revise the mind map, then answer the likely exam questions before opening the hints.`],
    fig:{mindmap:{center:'Data ethics 2',branches:[{t:'Biased data',items:['Repeats past unfairness','Gender Shades 2018']},{t:'Proxy variables',items:['Measure the wrong thing','Cost for need (2019)','Sensitive info sneaks back']},{t:'Misleading',items:['Cut axes','Cherry-picked periods','Missing comparisons']},{t:'Privacy, security',items:['Re-identification','Links open to anyone']},{t:'Over-collection',items:['Collect only what you need','Less to leak or misuse']}]},label:`The week as a mind map · then likely exam questions`, build:el=>W.practice(el,[
      {q:`Explain biased data with a real example.`,hint:`Data that under-represent some groups; Buolamwini &amp; Gebru (2018): up to 34.7% error for darker-skinned women vs 0.8% for lighter-skinned men.`},
      {q:`What is a proxy variable, and why can it cause unfair results?`,hint:`Stand-in for the real target or a sensitive feature; cost for need (Obermeyer 2019); differs between groups.`},
      {q:`How can true numbers mislead? Give two techniques.`,hint:`Cherry-picking the time window; cut axis; missing comparison; fix by showing full range and context.`},
      {q:`Give three ethics checks you would run on a student survey project.`,hint:`Who is missing; identifying columns and sharing settings; delete unneeded questions; fair charts.`}])} },

  { nav:'Exit check', title:'Exit check', kind:'check', minutes:5,
    narration:[`Four quick questions. Then work through the <a href="practice-midterm.html">practice midterm</a> for the rest of the session.`,`<strong>After the midterm:</strong> read <em>Be Data Literate</em>, Chapter 9, for Week 9 (Data-Informed Decision-Making).`],
    fig:{label:`Four questions`, build:el=>W.quiz(el,[
      {q:`An algorithm uses past spending to decide who needs care. This is a problem of…`,o:[`a proxy variable`,`too little data`,`a pie chart`,`over-collection`],a:0,why:`Cost stood in for need.`},
      {q:`Showing only the two months when sales fell, from a year of growth, is…`,o:[`cherry-picking`,`data cleaning`,`a data dictionary`,`prescriptive analytics`],a:0,why:`True numbers, misleading selection.`},
      {q:`In Gender Shades (2018), classifiers made the most errors for…`,o:[`lighter-skinned men`,`darker-skinned women`,`all groups equally`,`children`],a:1,why:`Up to 34.7% error, against at most 0.8% for lighter-skinned men.`},
      {q:`The best response to over-collection is to…`,o:[`collect only what you need`,`encrypt everything and keep it forever`,`publish it`,`add more questions`],a:0,why:`Less data means less risk.`}])} },
  { nav:'Micro-credentials', title:'Activity · Your micro-credentials map', kind:'activity', minutes:15, wide:true, credMap:true,
    narration:[`Everything we studied in Weeks 1–8 continues in a free industry unit. Three credentials, all free: IBM <b>Data Fundamentals</b> (Credly badge), <b>Power BI</b> on Microsoft Learn, and <b>OneDrive, Forms and Excel</b> skills.`],
    fig:{label:`Every week, mapped to a free unit · then start`, html:CREDMAP()} },
  ]
});
</script>
